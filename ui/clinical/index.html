<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cortex — Clinical Graph</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <span id="header-title">Cortex</span>
      <span id="header-subtitle">Clinical Graph</span>
      <div id="header-phases"></div>
    </header>

    <!-- Main area: canvas + side panel -->
    <div id="main">
      <!-- Sigma canvas mount point -->
      <div id="graph"></div>

      <!-- Side panel (chain-of-call) -->
      <aside id="side-panel">
        <div id="panel-header">
          <button id="panel-back-btn" aria-label="Back" title="Back">&#8592;</button>
          <span id="panel-node-label">—</span>
          <span id="panel-node-kind"></span>
          <button id="panel-close-btn" aria-label="Close panel" title="Close">&#215;</button>
        </div>
        <div id="panel-tabs">
          <button class="panel-tab active" data-tab="causal">Causal</button>
          <button class="panel-tab" data-tab="impact">Impact</button>
          <button class="panel-tab" data-tab="call">Call</button>
        </div>
        <!-- Node intelligence metrics (heat, stage, connections) -->
        <div id="panel-metrics"></div>
        <div id="panel-body">
          <div id="panel-neighbours-section">
            <p class="panel-section-title">Neighbours (local)</p>
            <ul class="neighbour-list" id="panel-neighbour-list"></ul>
          </div>
          <div id="panel-mermaid-section">
            <p class="panel-section-title">Chain diagram</p>
            <div id="panel-truncated-badge">&#9888; diagram capped at 150 nodes</div>
            <div id="panel-chain-error"></div>
            <div id="panel-mermaid-container">
              <div class="mermaid" id="panel-mermaid-div"></div>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Loading progress (fixed overlay) -->
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <span id="phase-label"></span>

  <!-- Depth indicator: dots + text label + loading spinner -->
  <div id="depth-indicator" aria-label="Current depth" role="group">
    <button class="depth-dot" data-depth="0" title="L0 — Overview" aria-label="Jump to L0 Overview" aria-pressed="false"></button>
    <button class="depth-dot" data-depth="1" title="L1 — Wings" aria-label="Jump to L1 Wings" aria-pressed="false"></button>
    <button class="depth-dot" data-depth="2" title="L2 — Departments" aria-label="Jump to L2 Departments" aria-pressed="false"></button>
    <button class="depth-dot" data-depth="3" title="L3 — Corridors" aria-label="Jump to L3 Corridors" aria-pressed="false"></button>
    <button class="depth-dot" data-depth="4" title="L4 — Rooms" aria-label="Jump to L4 Rooms" aria-pressed="false"></button>
    <button class="depth-dot" data-depth="5" title="L5 — Beds" aria-label="Jump to L5 Beds" aria-pressed="false"></button>
    <button class="depth-dot" data-depth="6" title="L6 — Atoms" aria-label="Jump to L6 Atoms" aria-pressed="false"></button>
    <div id="depth-label-row">
      <span id="depth-label" aria-live="polite"></span>
      <span id="depth-spinner" class="spinner" style="display:none" aria-label="Loading depth"></span>
    </div>
  </div>

  <!-- Node tooltip -->
  <div id="node-tooltip" role="tooltip">
    <div class="tooltip-label" id="tooltip-label"></div>
    <div class="tooltip-kind" id="tooltip-kind"></div>
  </div>

  <!-- Status bar -->
  <div id="status-bar" class="hidden"></div>

  <!-- Incomplete-data banner -->
  <div id="incomplete-banner">&#9888; graph incomplete — SSE stream failed</div>

  <!-- Vendor libraries (globals: window.Sigma, window.graphology, window.mermaid) -->
  <script src="vendor/graphology.umd.min.js"></script>
  <script src="vendor/sigma.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>

  <!-- Application entry point -->
  <script type="module" src="js/boot.js"></script>
</body>
</html>
