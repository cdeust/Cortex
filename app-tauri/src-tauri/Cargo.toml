[package]
name = "cortex-graph"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "cortex-graph"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
dirs = "5"
ureq = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
