.l{font-size:11.5px;fill:oklch(38% 0.020 55)}
.c{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.14em;fill:oklch(46% 0.020 55)}
.box{fill:oklch(97.5% 0.006 90);stroke:oklch(32% 0.02 60 / 0.42)}
.store{fill:oklch(91% 0.014 82);stroke:oklch(58% 0.020 60)}
.inner{fill:oklch(95% 0.010 85);stroke:oklch(32% 0.02 60 / 0.26)}
