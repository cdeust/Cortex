<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" role="img" aria-label="A Claude Code session reaches Cortex through two doors: the plugin hooks, which import core and infrastructure directly, and the MCP tools, which go through server, handlers, core and shared. Both wire every core seam through one composition-root function. Infrastructure writes to PostgreSQL, SQLite or files under ~/.claude/methodology. Claude Code&#x27;s own auto-memory is only read, for profiles."><style>
