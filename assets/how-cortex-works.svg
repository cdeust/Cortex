.dash{stroke-dasharray:5 4}
.ah{fill:oklch(46% 0.020 55)}
</style><rect width="1040" height="430" fill="oklch(95% 0.010 85)"/><defs><marker id="aA" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L8,4 L0,8 z"/></marker></defs><rect class="box" x="16" y="150" width="184" height="100" rx="4"/><text class="t" x="32" y="180">Claude Code session</text><text class="l" x="32" y="202">you, Claude,</text><text class="l" x="32" y="218">the subagents</text><rect class="box" x="290" y="30" width="230" height="110" rx="4"/><text class="c" x="306" y="52">DOOR 1 · AUTOMATIC</text><text class="t" x="306" y="76">Plugin hooks</text><text class="m" x="306" y="96">mcp_server/hooks/</text><text class="l" x="306" y="114">7 session events</text><text class="m" x="306" y="131">wire_composition_root()</text><rect class="box" x="290" y="196" width="230" height="182" rx="4"/><text class="c" x="306" y="218">DOOR 2 · EXPLICIT</text><text class="t" x="306" y="242">Cortex MCP server</text><rect class="inner" x="302" y="256" width="206" height="26" rx="3"/><text class="m" x="314" y="273">server · tool_registry_*</text><rect class="inner" x="302" y="288" width="206" height="26" rx="3"/><text class="m" x="314" y="305">handlers/ · composition</text><rect class="inner" x="302" y="320" width="98" height="46" rx="3"/><text class="m" x="314" y="338">core/</text><text class="l" x="314" y="356">pure, no I/O</text><rect class="inner" x="410" y="320" width="98" height="46" rx="3"/><text class="m" x="422" y="338">shared/</text><text class="l" x="422" y="356">stdlib only</text><rect class="box" x="600" y="150" width="190" height="100" rx="4"/><text class="t" x="616" y="180">infrastructure/</text><text class="m" x="616" y="200">pg_store · sqlite_store</text><text class="m" x="616" y="218">embedding_engine</text><text class="l" x="616" y="236">MiniLM-L6-v2, 384 d</text><rect class="store" x="850" y="20" width="174" height="118" rx="4"/><text class="c" x="864" y="40">OPT-IN</text><text class="t" x="864" y="62">PostgreSQL cortex</text><text class="m" x="864" y="82">memories · entities</text><text class="m" x="864" y="98">relationships</text><text class="m" x="864" y="114">wiki.* · checkpoints</text><text class="l" x="864" y="130">pgvector, pg_trgm</text><rect class="store" x="850" y="160" width="174" height="72" rx="4"/><text class="t" x="864" y="184">SQLite memory.db</text><text class="l" x="864" y="202">plugin install default</text><text class="m" x="864" y="220">sqlite-vec · FTS5</text><rect class="store" x="850" y="254" width="174" height="96" rx="4"/><text class="m" x="864" y="276">~/.claude/methodology/</text><text class="m" x="864" y="296">wiki/**/*.md</text><text class="m" x="864" y="314">profiles.json</text><text class="m" x="864" y="332">session-log.json</text><rect class="box" x="16" y="300" width="184" height="78" rx="4"/><text class="t" x="32" y="324">Auto-memory</text><text class="m" x="32" y="344">~/.claude/projects/</text><text class="m" x="32" y="362">*/memory/*.md</text><path class="edge" d="M200,180 H245 V85 H288" marker-end="url(#aA)"/><text class="l" x="240" y="130" text-anchor="end">events</text><path class="edge" d="M200,225 H245 V287 H288" marker-end="url(#aA)"/><text class="l" x="240" y="272" text-anchor="end">tool calls</text><path class="edge" d="M520,85 H560 V180 H598" marker-end="url(#aA)"/><text class="l" x="528" y="76">imports</text><path class="edge" d="M508,301 H560 V225 H598" marker-end="url(#aA)"/><text class="l" x="528" y="292">composes</text><path class="edge" d="M790,172 H818 V80 H848" marker-end="url(#aA)"/><text class="l" x="812" y="126" text-anchor="end">SQL</text><path class="edge" d="M790,196 H848" marker-end="url(#aA)"/><path class="edge" d="M790,228 H818 V300 H848" marker-end="url(#aA)"/><text class="l" x="812" y="276" text-anchor="end">files</text><path class="edge dash" d="M108,378 V400 H695 V252" marker-end="url(#aA)"/><text class="l" x="230" y="416">scanner: read for profiles, never copied into memories</text