[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypermnesia-mcp"
version = "4.21.0"
description = "Scientifically-grounded memory system based on computational neuroscience research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Clement Deust", email = "admin@ai-architect.tools" },
]
keywords = ["mcp", "codex", "gemini-cli", "claude-code", "memory", "cognitive-profiling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # source: ADR-0874
    #
    #
    #
    #
    #
    #
    #
    #
    #
    "mcp>=2.0.0",
    "anyio>=4.5",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    # source: ADR-0874
    #
    #
    #
    #
    #
    #
    #
    "sentence-transformers>=3.0.0",
    "flashrank>=0.2.0",
    # source: ADR-0874
    #
    #
    #
    #
    #
    #
    #
    #
    "python-dateutil>=2.8.2",
]

[project.urls]
Homepage = "https://github.com/cdeust/Cortex"
Repository = "https://github.com/cdeust/Cortex"

[project.scripts]
# source: ADR-0874
#
#
#
#
#
#
#
#
#
#
#
cortex-doctor = "mcp_server.doctor:run"
hypermnesia-mcp = "mcp_server.__main__:main"

[project.optional-dependencies]
postgresql = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    # source: ADR-0874
    #
    #
    "pgvector>=0.4,<0.6",
]
sqlite = [
    "sqlite-vec>=0.1.1",
]
codebase = [
    "tree-sitter>=0.24.0,<0.27",
    # source: ADR-0874
    #
    #
    #
    #
    #
