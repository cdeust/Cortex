    "error:The default datetime adapter is deprecated as of Python 3.12.*:DeprecationWarning",
]
markers = [
    "invariants: Phase 0.3+ testable invariant predicates (I1/I2/I3/I4 and parity tests)",
]

[tool.coverage.run]
source = ["mcp_server"]

[tool.coverage.report]
show_missing = true

