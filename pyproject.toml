    "tree-sitter-language-pack>=1.12.5,<1.17",
    "networkx>=3.0",
    # source: ADR-0874
    #
    #
    "leidenalg>=0.10",
    "igraph>=0.11",
]
# Optional CPU graph visualization endpoints: tiles, quadtree hit-testing, and layout recomputation.
# source: ADR-0874
viz-tile = [
    "igraph>=0.11",              # CPU layout (DrL / FR), MIT-licensed wheels
    "datashader>=0.16.3",        # tile rasterization, O(viewport pixels)
    "pyarrow>=15.0",             # Arrow IPC for the quadtree endpoint
    "pandas>=2.2",               # Datashader's native frame format
    "cachetools>=5.0",           # L1 in-memory tile LRU
    "Pillow>=10.0",              # PNG encode
]
benchmarks = [
    "datasets>=2.14.0",          # HuggingFace dataset loader (BEAM, LoCoMo, LongMemEval)
    "sentence-transformers>=3.0.0",  # all-MiniLM-L6-v2 embeddings
    "flashrank>=0.2.0",          # cross-encoder reranking (ms-marco-MiniLM-L-12-v2)
    "psycopg[binary]>=3.1",      # PostgreSQL driver
    "psycopg-pool>=3.2",         # pg_store.py imports ConnectionPool at module level
    "pgvector>=0.4,<0.6",        # vector similarity in PostgreSQL (bounds: see [postgresql])
    "pymupdf>=1.24.0",           # PDF parsing for some benchmark sources
]
# source: ADR-0874
#
#
#
#
#
otel = [
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    # source: ADR-0874
    #
    #
    #
    #
    "pytest-timeout>=2.3.0",
    "sentence-transformers>=3.0.0",
    "networkx>=3.0",
    # source: ADR-0874
    #
    #
    #
    #
    #
    #
    #
    #
    "exceptiongroup>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

# source: ADR-0874
#
#
[tool.hatch.build.targets.sdist]
exclude = [
    "/benchmarks/beam/variance/*.txt",
    "/video/captures",
    "/video/output",
    "/docs/**/*.png",
    "/docs/arxiv-*/**",
    "/docs/campaigns/*.json",
]

