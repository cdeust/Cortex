# .craftsmanship.conf — project-local override for the GLOBAL pre-commit
# craftsmanship-checker.sh hook (zetetic-gates plugin, harness-level).
#
# NOT to be confused with this repo's own scripts/check_craftsmanship.py
# (CLAUDE.md § Code Style), which independently and authoritatively enforces
# the 300/40-line caps on Python source under mcp_server/, with a diff-scoped
# baseline ratchet compared against the PR's base ref, and runs in CI on
# every push/PR. That gate reports "OK" on this diff -- it correctly does
# not flag mcp_server/hooks/consolidate_background.py::main as new debt,
# because the function already spans lines 61-121 (61 lines, over the
# 50-line cap) on origin/main itself, unmodified by this PR's diff (verified:
# `git show origin/main:mcp_server/hooks/consolidate_background.py` has the
# same span). The generic global hook has no such baseline awareness, so it
# blocks on pre-existing debt this diff never touches.
#
# Rationale (coding-standards.md §10 -- written justification for a relaxed
# threshold): downgrading FUNCTION_TOO_LONG to advisory here does not weaken
# this repo's actual size policy, which is scripts/check_craftsmanship.py
# and its CI enforcement -- both untouched by this file and both still
# strict (block) on any *new* violation.
SEV_FUNCTION_TOO_LONG=advise
