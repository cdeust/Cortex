name: HOL plugin scanner

# source: ADR-0804









#
# source: ADR-0804







on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 7 * * 2"   # Tuesdays 07:30 UTC — rule sets drift by inaction
  workflow_dispatch:

permissions:
  contents: read

# source: ADR-0804
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: HOL plugin scan
    runs-on: ubuntu-latest
    # source: ADR-0804
    timeout-minutes: 2
    permissions:
      contents: read
      security-events: write   # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the plugin repository
        uses: hashgraph-online/ai-plugin-scanner-action@966f1e711a202e0fd5987c120fbdb59b2f2a398b # v1.2.700
        with:
          plugin_dir: "."
          format: sarif
          output: hol-plugin-scan.sarif
          upload_sarif: "true"
          sarif_category: hol-plugin-scanner
          # source: ADR-0804




          min_score: "80"
          fail_on_severity: high
          cisco_skill_scan: "off"
