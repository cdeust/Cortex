              """Native Codex finding threads of the PR that the owner has not resolved."""
              if repo.count("/") != 1:
                  raise _runtime().EvidenceError("protocol")
              owner, name = repo.split("/")
              fields = dict(query=_runtime().THREAD_QUERY, owner=owner, name=name, number=pr)
              pages = _runtime()._api("graphql", paginate=True, fields=fields)
              return not all(_runtime()._thread_states(pages, sha, owner).values())


          def resolve_no_findings(target, body, review, metadata):
              """A null verdict after completion is clean only with Codex's +1 not earlier
              than both Completed rows of this summary for this head (second precision:
              reactions carry seconds, rows microseconds), no 👀 left, no finding text in
              the summary and no unresolved native finding thread. A commit date would
              not do: a later push of an older commit keeps its date (Cortex PR847 review).
              """
              repo, pr, sha = target
              flags = (review.get("has_any_findings"), review.get("has_unresolved_findings"))
              if flags != (None, None) or not _completed_here(target, review, metadata):
                  return None
              if any(marker in body for marker in FINDING_TEXT):
                  return None
              rows = COMPLETED_ROW.findall(body)
              if sorted(kind for kind, _, _ in rows) != sorted(REVIEW_KINDS):
                  return None
              if any(not sha.startswith(short) for _, _, short in rows):
                  return None
              finished = max(_stamp(stamp) for _, stamp, _ in rows).replace(microsecond=0)
              marks = _codex_reactions(repo, pr)
              if "eyes" in marks or "+1" not in marks or marks["+1"] < finished:
                  return None
              if _unresolved_findings(repo, pr, sha):
                  return None
              return {
                  "state": "success",
                  "source": "github_reaction",
                  "reacted_at": marks["+1"].strftime("%Y-%m-%dT%H:%M:%SZ"),
              }


          def reaction_verdict(proof, target, body, review, metadata):
              """The receipt's `verdict_missing` yields to the reaction; anything else stands."""
              if proof is None or proof.get("state") != _comments().MISSING:
                  return proof
              return resolve_no_findings(target, body, review, metadata) or proof
          '''

          AGREEMENT_SOURCE = r'''
          """Gate state for one head: both native Codex kinds, then the Claude verdict.

          Owner rule 2026-10-29 (verbatim): "until the review of codex and claude (done
          autonomously) are there, it cannot merge, the hold should be removed after
          reviewers agree on merging". Rules of the Cortex convergence planner
          (https://github.com/cdeust/Cortex/pull/834, scripts/ci_autopilot_converge_plan.py).
          The Claude verdict is the marker claude-review.yml asks for (source.json adaptation
          claude-review-verdict-marker); GraphQL author claude/Bot, prD evidence. Pure: no I/O.
          """

          from __future__ import annotations

          import re
          from typing import Any

          from ci_codex_review_runtime import EvidenceError, _json
          from ci_codex_review_comments import BLOCKED_REASONS, BLOCKING, BOT, MISSING
          from ci_codex_review_comments import STAMP_PATTERN, UNRECOGNIZED, _authenticate_editor

          Record = dict[str, Any]
          CLAUDE = "claude[bot]"
          VERDICT = re.compile(r"^<!-- claude-review-verdict:v1 (\{.*\}) -->$", re.MULTILINE)
          CLAUDE_CAUSES = {"missing": "claude_verdict_missing", "refused": "claude_refused",
                           "unreadable": "claude_verdict_unreadable"}
          # Rule D5 (ci_codex_review_comments.DEPENDABOT): no Claude review exists there.
          AGREED = ("merge", "not_applicable_dependabot")
          # Rule D6, 2026-10-29: a failed kind whose latest Codex Bot comment is a usage-limit
          # notice waits for quota, it is no finding. Real notices: cdeust/ci-autonome PR9
          # comment6497426761 ("has reached its Codex usage limits"), cdeust/ai-architect-
          # mcp-spec PR164 comment6497379059 and ai-architect-mcp-codebase PR469
          # comment6497357065 ("You have reached your Codex usage limits for code reviews").
          QUOTA = re.compile(r"\breached (?:its|your) Codex usage limits\b")
          CODEX_CAUSES = {
              "pending": "codex_{}_verdict_missing", "failed": "codex_{}_review_failed",
              "unresolved": "codex_{}_findings_unresolved", MISSING: "codex_{}_verdict_missing",
              UNRECOGNIZED: "codex_{}_receipt_unrecognized", "quota": "codex_quota_exhausted",
          }


          def _verdict(comment: Record, sha: str) -> bool | None:
              """The merge flag of one Claude App marker for this head, else None."""
              user, body, stamp = comment.get("user"), comment.get("body"), comment.get("updated_at")
              if not isinstance(user, dict) or (user.get("login"), user.get("type")) != (CLAUDE, "Bot"):
                  return None
              if not isinstance(body, str) or body.count("claude-review-verdict:v1") != 1:
                  return None
              found = VERDICT.findall(body)
              if len(found) != 1 or not isinstance(stamp, str) or not STAMP_PATTERN.fullmatch(stamp):
                  return None
              try:
                  value = _json(found[0])
              except EvidenceError:
                  return None  # A malformed marker reads as absent, never as a verdict.
              if not isinstance(value, dict) or set(value) != {"head", "merge"}:
                  return None
              return value["merge"] if value["head"] == sha and type(value["merge"]) is bool else None


          def claude_verdict(comments: list[Record], sha: str) -> Record:
              """Latest Claude verdict for this head; one edited by anyone else is unreadable."""
              marked = [(c, merge) for c in comments if (merge := _verdict(c, sha)) is not None]
              if not marked:
                  verdict = "not_applicable_dependabot" if getattr(comments, "dependabot", False) is True else "missing"
                  return {"verdict": verdict, "comment_id": 0}
              comment, merge = max(marked, key=lambda row: (row[0]["updated_at"], row[0]["id"]))
              try:
                  _authenticate_editor(comment, "claude")
              except EvidenceError:
                  return {"verdict": "unreadable", "comment_id": comment["id"]}
              return {"verdict": "merge" if merge else "refused", "comment_id": comment["id"]}


          def _quota(comments: list[Record]) -> bool:
              """True when the latest comment of the Codex Bot is a usage-limit notice."""
              stamped = [
                  c for c in comments
                  if (c.get("user") or {}).get("login") == BOT and (c.get("user") or {}).get("type") == "Bot"
                  and isinstance(c.get("updated_at"), str) and STAMP_PATTERN.fullmatch(c["updated_at"])
              ]
              if not stamped:
                  return False
              latest = max(stamped, key=lambda c: (c["updated_at"], c["id"]))
              return isinstance(latest.get("body"), str) and QUOTA.search(latest["body"]) is not None


          def conclude(states: list[str] | None, comments: list[Record], sha: str) -> Record:
              """Gate state for the head: both Codex kinds (None: no summary), then Claude."""
              claude = claude_verdict(comments, sha)
              verdict, codex = claude["verdict"], list(states or ["pending", "pending"])
              if "failed" in codex and _quota(comments):
                  codex = ["quota" if state == "failed" else state for state in codex]
              causes = list(dict.fromkeys(
                  CODEX_CAUSES[state].format(kind)
                  for kind, state in zip(("code", "security"), codex)
                  if state != "success"
              )) + ([CLAUDE_CAUSES[verdict]] if verdict not in AGREED else [])
              if any(s in BLOCKING for s in codex):
                  state = "blocked", next((r for s, r in BLOCKED_REASONS if s in codex), "review_unresolved")
              elif verdict in ("refused", "unreadable"):
                  state = "blocked", CLAUDE_CAUSES[verdict]
              elif "quota" in codex:
                  state = "pending", CODEX_CAUSES["quota"]
              elif "pending" in codex:
                  state = "pending", "review_pending" if states else "review_missing"
              elif verdict == "missing":
                  state = "pending", CLAUDE_CAUSES[verdict]
              else:
                  state = "success", "reviews_complete"
              complete = all(s in ("success", "unresolved") for s in codex)
              return dict(state=state[0], reason=state[1], causes=causes, claude=claude,
                          reviews_complete=complete and verdict in (*AGREED, "refused"))
          '''

          READER_SOURCE = r'''
          #!/usr/bin/env python3
          """Read authenticated native Codex review evidence for one immutable PR head.

          Protocol: Cortex PR797 bot comment6428675514, captured in
           tasks/ci-review-evidence-codex-{711f0ede,57e4c1d}.json. Native automation:
          https://learn.chatgpt.com/docs/third-party/github
          https://learn.chatgpt.com/docs/security/security-review
          This validates completion metadata, not semantic review quality.
          """

          from __future__ import annotations

          import argparse
          import json
          import re
          import sys
          from datetime import datetime
          from pathlib import Path
          from typing import Any

          # CLI callers execute this trusted file; the isolated workflow preloads its
          # exact embedded runtime, so candidate checkout imports are never consulted.
          if "ci_codex_review_runtime" not in sys.modules:
              sys.path.insert(0, str(Path(__file__).resolve().parent))
          import ci_codex_review_runtime as runtime  # noqa: E402
          from ci_codex_review_runtime import _outputs  # noqa: E402
          from ci_codex_review_comments import _authenticate_editor, _bot_author, _canonical  # noqa: E402
          from ci_codex_review_comments import security_receipt  # noqa: E402
          from ci_codex_review_reaction import reaction_verdict  # noqa: E402
          from ci_codex_review_agreement import conclude  # noqa: E402

          Record = dict[str, Any]
          SUMMARY = "<!-- codex-pull-request-review-summary -->"
          BOT = "chatgpt-codex-connector[bot]"
          KINDS = ("code_review", "security_review")
          FAILED = ("failed", "error", "cancelled")
          SHA_PATTERN = re.compile(r"[0-9a-f]{40}")
          REPO_PATTERN = re.compile(r"[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+")
          STAMP_PATTERN = re.compile(r"\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z")


          class EvidenceError(runtime.EvidenceError):
              """Preserve the evidence-reader exception interface for its event callers."""


          class APIError(runtime.APIError, EvidenceError):
              """Retain transport category within the reader exception catch boundary."""


          def _json(text: str) -> Any:
              try:
                  return runtime._json(text)
              except runtime.EvidenceError as exc:
                  raise EvidenceError(str(exc)) from exc


          def _api(endpoint: str, *, paginate: bool = False, fields: Record | None = None) -> Any:
              try:
                  options = {"fields": fields} if fields is not None else {}
                  return runtime._api(endpoint, paginate=paginate, **options)
              except runtime.APIError as exc:
                  raise APIError(exc.category) from exc
              except runtime.EvidenceError as exc:
                  raise EvidenceError(str(exc)) from exc


          class Parser(argparse.ArgumentParser):
              def error(self, message: str) -> None:
                  raise EvidenceError("arguments")


          def _result(sha: str) -> Record:
              result = {
                  "state": "pending",
                  "reason": "review_missing",
                  "sha": sha,
                  "comment_id": 0,
                  "updated_at": None,
                  "reviews_complete": False,
              }
              for kind in KINDS:
                  result[kind] = {
                      "commit_sha": None,
                      "status": None,
                      "has_any_findings": None,
                      "has_unresolved_findings": None,
                  }
              return result


          def _order(comment: Record) -> tuple[datetime, int]:
              identity, updated = comment.get("id"), comment.get("updated_at")
              if type(identity) is not int or identity <= 0:
                  raise EvidenceError("protocol")
              if not isinstance(updated, str) or STAMP_PATTERN.fullmatch(updated) is None:
                  raise EvidenceError("protocol")
              try:
                  return datetime.fromisoformat(updated.replace("Z", "+00:00")), identity
              except ValueError as exc:
                  raise EvidenceError("protocol") from exc


          def _marker(body: str, name: str, required: bool) -> Any:
              count = body.count("<!-- " + name + ":")
              if count == 0 and not required:
                  return None
              if count != 1:
                  raise EvidenceError("protocol")
              pattern = re.escape("<!-- " + name + ":v1") + r"\s+(.*?)\s*-->"
              match = re.search(pattern, body, re.DOTALL)
              if match is None:
                  raise EvidenceError("protocol")
              value = _json(match.group(1))
              if not isinstance(value, dict):
                  raise EvidenceError("protocol")
              return value


          def _review(value: Any, expected_sha: str) -> tuple[str, Record]:
              clean = _result(expected_sha)["code_review"]
              if value is None or value == {}:
                  return "pending", clean
              if not isinstance(value, dict):
                  raise EvidenceError("protocol")
              status, sha = value.get("status"), value.get("commit_sha")
              if status is not None and status not in ("completed", "running", "queued", *FAILED):
                  raise EvidenceError("protocol")
              if sha is not None and (
                  not isinstance(sha, str) or SHA_PATTERN.fullmatch(sha) is None
              ):
                  raise EvidenceError("protocol")
              clean.update(status=status, commit_sha=sha)
              for flag in ("has_any_findings", "has_unresolved_findings"):
                  item = value.get(flag)
                  if item is not None and type(item) is not bool:
                      raise EvidenceError("protocol")
                  if status == "completed" and flag not in value:
                      raise EvidenceError("protocol")
                  clean[flag] = item
              if clean["has_any_findings"] is False and clean["has_unresolved_findings"] is True:
                  raise EvidenceError("protocol")
              if status == "completed" and sha is None:
                  raise EvidenceError("protocol")
              if status in FAILED:
                  return "failed", clean
              # source: PR805 summary6442631163 emitted completed with an unknown verdict.
              flags = (clean["has_any_findings"], clean["has_unresolved_findings"])
              if sha != expected_sha or status != "completed" or None in flags:
                  return "pending", clean
              return ("unresolved" if clean["has_unresolved_findings"] else "success"), clean


          def _reviews(latest, target, comments):
              expected_sha, repo, pr = target
              reviews = {}
              data = _marker(latest["body"], "codex-review-state", True)
              security = _marker(latest["body"], "codex-security-review", False)
              states = []
              for kind in KINDS:
                  state, reviews[kind] = _review(data.get(kind), expected_sha)
                  proof, attested = None, state == "success" and reviews[kind]["has_any_findings"] is True
                  if kind == "security_review" and (state == "pending" or attested) and repo and pr:
                      proof = runtime.resolve_security(
                          (repo, pr, expected_sha), latest["body"], reviews[kind], security
                      ) or security_receipt(
                          comments, (repo, pr, expected_sha), reviews[kind], security
                      )
                      proof = reaction_verdict(
                          proof, (repo, pr, expected_sha), latest["body"], reviews[kind], security
                      )
                  if proof is not None:
                      state = proof.pop("state")
                      reviews[kind]["resolution"] = proof
                  states.append(state)
              return states, reviews


          def review_evidence(
              comments: list[Record], expected_sha: str, repo=None, pr=None
          ) -> Record:
              """Require both current reviews; never fall back from a newer invalid summary."""
              valid_sha = isinstance(expected_sha, str) and SHA_PATTERN.fullmatch(expected_sha)
              result = _result(expected_sha if valid_sha else "")
              try:
                  if not valid_sha or not isinstance(comments, list):
                      raise EvidenceError("arguments" if not valid_sha else "protocol")
                  if any(not isinstance(comment, dict) for comment in comments):
                      raise EvidenceError("protocol")
                  candidates = [comment for comment in comments if _canonical(comment)]
                  if not candidates:
                      return {**result, **conclude(None, comments, expected_sha)}
                  latest = max(candidates, key=_order)
                  result.update(comment_id=latest["id"], updated_at=latest["updated_at"])
                  latest_order = _order(latest)
                  # A human can remove the marker while retaining the original Bot author.
                  for item in comments:
                      if _bot_author(item) and _order(item) >= latest_order:
                          _authenticate_editor(item)
                  if latest["body"].count(SUMMARY) != 1:
                      raise EvidenceError("protocol")
                  states, details = _reviews(latest, (expected_sha, repo, pr), comments)
                  result.update(details)
                  result.update(conclude(states, comments, expected_sha))  # Codex, then Claude.
              except runtime.EvidenceError as exc:
                  result.update(state="blocked", reason=str(exc), reviews_complete=False)
                  if isinstance(exc, runtime.APIError):
                      result["api_category"] = exc.category
              return result


          def summary_comments(repo: str, pr: int, sha: str, request) -> list[Record]:
              try:
                  return runtime.summary_comments(repo, pr, sha, request)
              except runtime.APIError as exc:
                  raise APIError(exc.category) from exc
              except runtime.EvidenceError as exc:
                  raise EvidenceError(str(exc)) from exc


          def _eligible(pull: Any, repo: str, sha: str) -> None:
              if not isinstance(pull, dict):
                  raise EvidenceError("pr_eligibility")
              head, base = pull.get("head"), pull.get("base")
              if not isinstance(head, dict) or not isinstance(base, dict):
                  raise EvidenceError("pr_eligibility")
              head_repo, base_repo = head.get("repo"), base.get("repo")
              if not isinstance(head_repo, dict) or not isinstance(base_repo, dict):
                  raise EvidenceError("pr_eligibility")
              if any(
                  not isinstance(item.get("full_name"), str) for item in (head_repo, base_repo)
              ):
                  raise EvidenceError("pr_eligibility")
              if (
                  pull.get("state") != "open"
                  or pull.get("draft") is not False
                  or base.get("ref") != "main"
                  or head_repo.get("full_name", "").casefold() != repo.casefold()
                  or base_repo.get("full_name", "").casefold() != repo.casefold()
              ):
                  raise EvidenceError("pr_eligibility")
              if head.get("sha") != sha:
                  raise EvidenceError("head_moved")


          def _fetch(args: argparse.Namespace) -> Record:
              endpoint = f"repos/{args.repo}/pulls/{args.pr}"
              _eligible(_api(endpoint), args.repo, args.sha)
              comments = summary_comments(args.repo, args.pr, args.sha, _api)
              result = review_evidence(comments, args.sha, args.repo, args.pr)
              _eligible(_api(endpoint), args.repo, args.sha)
              return result


          def _arguments(argv: list[str] | None) -> argparse.Namespace:
              parser = Parser(description=__doc__)
              parser.add_argument("--repo", required=True)
              parser.add_argument("--pr", required=True, type=int)
              parser.add_argument("--sha", required=True)
              parser.add_argument("--github-output", action="store_true")
              parser.add_argument("--require-complete", action="store_true")
              parser.add_argument("--allow-pending", action="store_true")
              args = parser.parse_args(argv)
              if (
                  REPO_PATTERN.fullmatch(args.repo) is None
                  or args.repo.split("/")[1] in (".", "..")
                  or args.pr <= 0
                  or SHA_PATTERN.fullmatch(args.sha) is None
              ):
                  raise EvidenceError("arguments")
              return args


          def main(argv: list[str] | None = None) -> int:
              try:
                  args = _arguments(argv)
                  result = _fetch(args)
                  if args.github_output:
                      _outputs(result)
                  print(json.dumps(result, sort_keys=True))
                  if args.allow_pending and result["state"] == "pending":
                      return 0
                  if (
                      args.require_complete
                      and result["reviews_complete"]
                      and result["reason"] in ("reviews_complete", "review_unresolved")
                  ):
                      return 0
                  return {"success": 0, "pending": 2, "blocked": 1}[result["state"]]
              except runtime.EvidenceError as exc:
                  print(f"codex reviews: {exc}", file=sys.stderr)
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          '''

          _runtime = ModuleType("ci_codex_review_runtime")
          exec(compile(RUNTIME_SOURCE, "ci_codex_review_runtime.py", "exec"), _runtime.__dict__)
          sys.modules[_runtime.__name__] = _runtime
          _comments = ModuleType("ci_codex_review_comments")
          exec(compile(COMMENTS_SOURCE, "ci_codex_review_comments.py", "exec"), _comments.__dict__)
          sys.modules[_comments.__name__] = _comments
          _reaction = ModuleType("ci_codex_review_reaction")
          exec(compile(REACTION_SOURCE, "ci_codex_review_reaction.py", "exec"), _reaction.__dict__)
          sys.modules[_reaction.__name__] = _reaction
          _agreement = ModuleType("ci_codex_review_agreement")
          exec(compile(AGREEMENT_SOURCE, "ci_codex_review_agreement.py", "exec"), _agreement.__dict__)
          sys.modules[_agreement.__name__] = _agreement
          exec(compile(READER_SOURCE, "ci_codex_reviews.py", "exec"))
          CODEX_REVIEW_PY

  # Decision 4, hardened after claude-mods #38 and session-optimizer #73 merged
  # on a red pipeline: GitHub treats a skipped required check as satisfied, so
  # merge runs even after failure on a non-cancelled same-repo PR, and fails if a
  # test job did not succeed. Pending reviews keep the required name expected.
  # No checkout or merge
  # mutation here: the completed-run resolver performs the protected merge.
  merge:
    # The aggregate of the test jobs of this run: green when they all are. It reads
    # nothing else (no main, no review state, no live PR label). When they are
    # green it arms GitHub's native auto-merge on this PR, so the merge happens
    # with this PR's own definition in the path and nothing from main's: a PR
    # that fixes the pipeline is merged by the pipeline it fixes (owner rule
    # 2026-11-03: a CI that blocks itself and cannot correct itself is not
    # autonomous). Branch protection stays the only gate: GitHub squashes as
    # soon as the required checks pass, this job included.
    needs: [contract, unit, regression, e2e, environment, install]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require the test jobs of this run
        env:
          CONTRACT: ${{ needs.contract.result }}
          UNIT: ${{ needs.unit.result }}
          REGRESSION: ${{ needs.regression.result }}
          E2E: ${{ needs.e2e.result }}
          ENVIRONMENT: ${{ needs.environment.result }}
          INSTALL: ${{ needs.install.result }}
        run: |
          blocked=""
          for pair in "contract=$CONTRACT" "unit=$UNIT" "regression=$REGRESSION" "e2e=$E2E" "environment=$ENVIRONMENT" "install=$INSTALL"; do
            case "$pair" in
              *=success) ;;
              *) echo "::error::${pair%%=*}: ${pair#*=}, needs success"; blocked=1 ;;
            esac
          done
          if [ -n "$blocked" ]; then
            echo "## Merge: blocked, a test job is not green on this commit" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## Merge: the test jobs are green on this commit" >> "$GITHUB_STEP_SUMMARY"

      # This job is itself a required check and still running, so a direct merge
      # here would be refused; auto-merge lets GitHub perform the squash the
      # moment branch protection is satisfied. --match-head-commit binds the
      # arming to this head: a later push disarms it until its own run passes.
      # source: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/incorporating-changes-from-a-pull-request/automatically-merging-a-pull-request
      # and https://cli.github.com/manual/gh_pr_merge (--auto, --match-head-commit).
      - name: Arm auto-merge, GitHub merges when the required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # Only PRs into main are merged by this path, the boundary the resolve
          # job keeps (base.ref == main). Codex finding on #238 (P2).
          if [ "$BASE" != "main" ]; then
            echo "## Merge: tests green; base is $BASE, not main, auto-merge not armed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Owner holds stay owner holds: a do-not-merge label or a "do not merge"
          # title is read live before arming, the same two the resolve job reads,
          # and a hold found here revokes any earlier arming (GitHub keeps an armed
          # request across a writer's push). Codex findings on #238 (P1).
          held="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,labels \
            --jq '[(.title | ascii_downcase | contains("do not merge")), ([.labels[].name | ascii_downcase] | index("do-not-merge") != null)] | any')"
          if [ "$held" = "true" ]; then
            if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto >disarm.log 2>&1; then
              grep -qiE "not enabled|not allowed|no auto-merge|is not in auto-merge" disarm.log || { cat disarm.log; echo "::error::disarming auto-merge failed"; exit 1; }
            fi
            echo "## Merge: tests green, owner hold on the PR (do-not-merge label or title), auto-merge not armed, any earlier arming revoked" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD" >arm.log 2>&1; then
            echo "## Merge: auto-merge armed for $HEAD, GitHub merges when the required checks pass" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat arm.log
          if grep -qiE "already enabled|clean status|already (been )?merged" arm.log; then
            echo "## Merge: auto-merge was already armed or the PR is already merged" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -qiE "not allowed|not enabled" arm.log; then
            echo "::warning::auto-merge is disabled in this repository's settings (Allow auto-merge); the completion resolver merges instead"
            echo "## Merge: auto-merge is disabled in Settings, the completion resolver merges" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::arming auto-merge failed"
          exit 1


  # Decision 1: the release gate of Cortex (.github/workflows/ci.yml, ADR-0802)
  # with validated versions from ci.json. Missing tags are pushed atomically over
  # the deploy key so the tag-triggered release workflows fire.
  tag:
    # Publish only after all five categories pass on the actual merge commit.
    needs: [contract, unit, regression, e2e, environment, install]
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.contract.result == 'success'
      && needs.unit.result == 'success'
      && needs.regression.result == 'success'
      && needs.e2e.result == 'success'
      && needs.environment.result == 'success'
      && needs.install.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-tag-${{ needs.contract.outputs.release_group }}
      cancel-in-progress: false
    steps:
      - name: Guard, skip cleanly when RELEASE_TAG_SSH_KEY is missing
        id: guard
        env:
          SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "RELEASE_TAG_SSH_KEY secret not configured, skipping."
            echo "Add the private half of a write-enabled repository deploy"
            echo "key at Settings -> Secrets and variables -> Actions."
            echo "has_deploy_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_deploy_key=true" >> "$GITHUB_OUTPUT"
          fi

      # No working tree of the tested commit is checked out here. This job holds
      # a write-enabled deploy key and runs after a workflow_run event, so a
      # checkout is the CodeQL finding actions/untrusted-checkout (Cortex PR839,
      # ai-architect-mcp-codebase PR471, high). The publish step needs only the
      # commit object and an authenticated origin: a bare repository with the
      # commit fetched by SHA gives both and executes nothing from the commit.
      # GitHub's SSH host keys are read from api.github.com/meta over TLS at run
      # time (source: docs.github.com, "GitHub's SSH key fingerprints"), the
      # same keys actions/checkout installs, without a hard-coded copy to age.
      - name: Fetch the tested commit into a bare repository
        if: steps.guard.outputs.has_deploy_key == 'true'
        env:
          SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
          TESTED_SHA: ${{ needs.contract.outputs.tested_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TESTED_SHA" in
            *[!0-9a-f]* | '') echo "::error::tested_sha is not a lowercase hex SHA"; exit 1 ;;
          esac
          [ "${#TESTED_SHA}" -eq 40 ] || { echo "::error::tested_sha is not 40 hex chars"; exit 1; }
          key_dir="$RUNNER_TEMP/release-key"
          (umask 077 && mkdir -p "$key_dir" && printf '%s\n' "$SSH_KEY" > "$key_dir/id")
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$key_dir/known_hosts"
          [ -s "$key_dir/known_hosts" ] || { echo "::error::api.github.com/meta returned no SSH host keys"; exit 1; }
          ssh_command="ssh -i $key_dir/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$key_dir/known_hosts -o StrictHostKeyChecking=yes"
          echo "GIT_SSH_COMMAND=$ssh_command" >> "$GITHUB_ENV"
          export GIT_SSH_COMMAND="$ssh_command"
          repo="$RUNNER_TEMP/release-repo"
          git init --quiet --bare "$repo"
          git -C "$repo" remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git -C "$repo" fetch --quiet --depth=1 origin "$TESTED_SHA"
          [ "$(git -C "$repo" cat-file -t "$TESTED_SHA")" = commit ] || { echo "::error::fetched object is not a commit"; exit 1; }

      - name: Set up Python
        if: steps.guard.outputs.has_deploy_key == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Publish declared package tags
        id: publish
        if: steps.guard.outputs.has_deploy_key == 'true'
        working-directory: ${{ runner.temp }}/release-repo
        env:
          RELEASE_TAGS: ${{ needs.contract.outputs.release_tags }}
          TESTED_SHA: ${{ needs.contract.outputs.tested_sha }}
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Publish validated package versions without overwriting an existing tag.

          Source: tasks/package-release-tags.md; git-scm.com/docs/git-push (--atomic).
          Concurrent overlap is retried only after the pending set strictly shrinks.
          """

          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path


          def git(*args, check=True):
              return subprocess.run(["git", *args], text=True, capture_output=True, check=check)


          def validate(tags, sha):
              if not isinstance(sha, str) or re.fullmatch(r"[0-9a-f]{40}", sha) is None:
                  raise ValueError("Release target must be a full commit SHA")
              if git("cat-file", "-t", sha).stdout.strip() != "commit":
                  raise ValueError("Release target must name a commit object")
              if (
                  not isinstance(tags, list)
                  or not tags
                  or any(not isinstance(t, str) or not t for t in tags)
              ):
                  raise ValueError("release_tags must be a nonempty list of tag names")
              if len(set(tags)) != len(tags):
                  raise ValueError("duplicate release tags")
              for tag in tags:
                  git("check-ref-format", "refs/tags/" + tag)
                  if any(other != tag and other.startswith(tag + "/") for other in tags):
                      raise ValueError("conflicting release tag refs")


          def remote_existing(tags):
              refs = {"refs/tags/" + tag: tag for tag in tags}
              output = git("ls-remote", "--refs", "origin", *refs).stdout
              return {
                  refs[line.split()[1]]
                  for line in output.splitlines()
                  if len(line.split()) == 2 and line.split()[1] in refs
              }


          def prepare_local(tags, sha):
              for tag in tags:
                  ref = "refs/tags/" + tag
                  found = git("show-ref", "--verify", "--quiet", ref, check=False)
                  if found.returncode == 0:
                      if git("rev-parse", ref + "^{}").stdout.strip() != sha:
                          raise ValueError("Local unpublished tag points elsewhere: " + tag)
                  elif found.returncode == 1:
                      git(
                          "-c",
                          "user.name=github-actions[bot]",
                          "-c",
                          "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                          "tag",
                          "-a",
                          "-m",
                          "Release " + tag,
                          "--",
                          tag,
                          sha,
                      )
                  else:
                      raise subprocess.CalledProcessError(
                          found.returncode, found.args, stderr=found.stderr
                      )


          def publish(tags, sha):
              existing = remote_existing(tags)
              pending = set(tags) - existing
              while pending:
                  prepare_local(sorted(pending), sha)
                  refs = [f"refs/tags/{tag}:refs/tags/{tag}" for tag in sorted(pending)]
                  result = git("push", "--atomic", "origin", *refs, check=False)
                  if result.returncode == 0:
                      return sorted(pending), sorted(existing)
                  remaining = pending - remote_existing(sorted(pending))
                  if not remaining < pending:
                      raise subprocess.CalledProcessError(
                          result.returncode, result.args, stderr=result.stderr
                      )
                  existing.update(pending - remaining)
                  pending = remaining
              return [], sorted(existing)


          def main():
              try:
                  tags = json.loads(os.environ["RELEASE_TAGS"])
                  sha = os.environ["TESTED_SHA"]
                  validate(tags, sha)
                  published, existing = publish(tags, sha)
              except (ValueError, OSError, KeyError, subprocess.CalledProcessError) as exc:
                  print(getattr(exc, "stderr", None) or str(exc), file=sys.stderr)
                  return 1
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
                  for tag in published:
                      out.write(f"Published {tag} at {sha}\n")
                  for tag in existing:
                      out.write(f"Existing {tag}: target preserved\n")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Summarize missing release key
        if: steps.guard.outputs.has_deploy_key != 'true'
        run: echo "## Release gate skipped, RELEASE_TAG_SSH_KEY not configured" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failed release publication
        if: failure() && steps.guard.outputs.has_deploy_key == 'true'
        run: echo "## Release gate failed; no publication success is claimed" >> "$GITHUB_STEP_SUMMARY"
