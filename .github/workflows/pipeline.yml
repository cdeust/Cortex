# generated by zetetic-team-subagents render-ci
name: Pipeline

# The single CI of docs/superpowers/specs/2026-10-22-single-ci-design.md:
# contract, unit, regression, e2e, environment, install, merge on a
# pull request; five tests then tag on main or a resolved merge SHA. Rendered by
# zetetic-team-subagents `scripts/setup.sh render-ci`: edit the template.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Git Bash on Windows, so every ci.json command is one shell on the three OS.
defaults:
  run:
    shell: bash

concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # source: claude-mods PR45, unit job119805310369 passed with 2.1.306.
  CLAUDE_CODE_VERSION: "2.1.306"

jobs:
  contract:
    if: >-
      !cancelled()
    runs-on: ubuntu-latest
    outputs:
      tested_sha: ${{ steps.source.outputs.tested_sha }}
      unit: ${{ steps.commands.outputs.unit }}
      regression: ${{ steps.commands.outputs.regression }}
      e2e: ${{ steps.commands.outputs.e2e }}
      environment: ${{ steps.commands.outputs.environment }}
      install: ${{ steps.commands.outputs.install }}
      release_tags: ${{ steps.commands.outputs.release_tags }}
      release_group: ${{ steps.commands.outputs.release_group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Record tested commit
        id: source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Guard - no comparison against main (owner rule 2026-10-29)
        run: python3 -m unittest discover -s scripts/tests -p test_no_main_comparison.py -v

      - name: Validate ci.json
        id: commands
        run: |
          python3 - "$GITHUB_WORKSPACE" --github-output <<'PY'
          #!/usr/bin/env python3
          """ci_contract.py -- validates a repository's ``ci.json`` before any test runs.

          The contract (docs/superpowers/specs/2026-10-22-single-ci-design.md, "Repository
          contract: ci.json"): exactly the keys ``unit``, ``regression``, ``e2e``,
          ``environment`` and ``install``, each a non-empty shell command, plus an
          optional ``version_file`` (default ``.claude-plugin/plugin.json``), or exclusive
          ``release_packages`` entries with version_file and tag_prefix, plus the
          required ``low_risk_files``: the file names (no directory) a low-risk
          dependency update may touch, read by the merge resolver. Every manifest
          version and tag ref is validated before exporting commands or release tags.
          A missing file, a missing key or an empty command fails the pipeline here, so a step that
          has nothing to run never passes (the design's first anti-goal).

          This file is also embedded verbatim in ``templates/ci/pipeline.yml`` as an inline
          ``python3 -`` step: standard library only, arguments through ``sys.argv``.

          Usage: ``python3 tools/ci_contract.py [repo-root]`` (default: the current
          directory). Exit 0 and the five commands plus ``version_file`` on stdout when
          valid; exit 1 and the faults on stderr otherwise. --github-output exports the
          validated commands and tags to GITHUB_OUTPUT. Source: tasks/package-release-tags.md.
          """

          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          import sys
          import uuid
          from pathlib import Path
          from typing import List

          KEYS = ("unit", "regression", "e2e", "environment", "install")
          VERSION_KEY = "version_file"
          DEFAULT_VERSION_FILE = ".claude-plugin/plugin.json"
          RELEASE_KEY = "release_packages"
          LOW_RISK_KEY = "low_risk_files"
          ALLOWED_KEYS = KEYS + (VERSION_KEY, RELEASE_KEY, LOW_RISK_KEY)
          ALLOWED = ", ".join(ALLOWED_KEYS)


          def _load(root: Path):
              """The parsed document, or the one fault that stops validation."""
              path = root / "ci.json"
              if not path.is_file():
                  return None, "ci.json: missing"
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (ValueError, UnicodeDecodeError) as exc:
                  return None, f"ci.json: not valid JSON ({exc})"
              if not isinstance(data, dict):
                  return None, "ci.json: must be a JSON object"
              return data, None


          def _release_specs(data: dict) -> list[dict]:
              """Explicit package identities, or the historical single v<version> tag."""
              if RELEASE_KEY not in data:
                  return [
                      {
                          "version_file": data.get(VERSION_KEY, DEFAULT_VERSION_FILE),
                          "tag_prefix": "v",
                      }
                  ]
              if VERSION_KEY in data:
                  raise ValueError("release_packages: cannot be combined with version_file")
              specs = data[RELEASE_KEY]
              if not isinstance(specs, list) or not specs:
                  raise ValueError("release_packages: must be a nonempty list")
              for spec in specs:
                  if not isinstance(spec, dict) or set(spec) != {"version_file", "tag_prefix"}:
                      raise ValueError(
                          "release_packages: entries need version_file and tag_prefix only"
                      )
              return specs


          def _manifest_path(root: Path, value: str) -> Path:
              if not isinstance(value, str):
                  raise ValueError("version_file: not a string")
              if not value.strip():
                  raise ValueError("version_file: empty path")
              relative = Path(value)
              path = (root / relative).resolve()
              if (
                  relative.is_absolute()
                  or ".." in relative.parts
                  or not path.is_relative_to(root.resolve())
              ):
                  raise ValueError("version_file: must stay inside the repository")
              if not path.is_file():
                  raise ValueError(f"version_file: {value} does not exist")
              return path


          def _manifest_version(path: Path) -> str:
              body = path.read_text(encoding="utf-8")
              if path.suffix == ".json":
                  doc = json.loads(body)
                  # Existing bundle contract: session-optimizer/tools/build-release-bundle.sh
                  # at 9145994e221d13693bb4a243a2a810c466fa077a reads metadata.version.
                  if isinstance(doc, dict) and "version" not in doc:
                      doc = doc.get("metadata")
              elif path.suffix == ".toml":
                  # Stdlib parser added in 3.11: https://docs.python.org/3/library/tomllib.html.
                  try:
                      import tomllib
                  except ImportError as exc:
                      raise ValueError(
                          "version_file: TOML requires Python 3.11+ (stdlib tomllib)"
                      ) from exc
                  doc = tomllib.loads(body)
                  doc = doc.get("project") or doc.get("package")
              else:
                  raise ValueError(f"version_file: unsupported format: {path.name}")
              version = doc.get("version") if isinstance(doc, dict) else None
              if not isinstance(version, str) or not version or version != version.strip():
                  raise ValueError(f"version_file: {path.name} needs a nonempty string version")
              return version


          def _valid_tag(tag: str) -> bool:
              # Delegate ref grammar to Git: https://git-scm.com/docs/git-check-ref-format.
              return (
                  subprocess.run(
                      ["git", "check-ref-format", f"refs/tags/{tag}"], capture_output=True
                  ).returncode
                  == 0
              )


          def release_tags(data: dict, root: Path) -> list[str]:
              """Resolve and validate the whole release plan without filesystem writes."""
              tags, paths, prefixes = [], set(), set()
              for spec in _release_specs(data):
                  path = _manifest_path(root, spec["version_file"])
                  prefix = spec["tag_prefix"]
                  if not isinstance(prefix, str) or not prefix or not _valid_tag(prefix + "0"):
                      raise ValueError("tag_prefix: invalid Git tag prefix")
                  if path in paths or prefix in prefixes:
                      raise ValueError("release_packages: duplicate manifest or tag prefix")
                  version = _manifest_version(path)
                  tag = prefix + version
                  if not _valid_tag(tag):
                      raise ValueError(f"version_file: invalid Git tag: {tag!r}")
                  if any(
                      tag == prior or tag.startswith(prior + "/") or prior.startswith(tag + "/")
                      for prior in tags
                  ):
                      raise ValueError("release_packages: duplicate or conflicting tag refs")
                  tags.append(tag)
                  paths.add(path)
                  prefixes.add(prefix)
              return tags


          def _version_faults(data: dict, root: Path) -> List[str]:
              try:
                  release_tags(data, root)
              except (ValueError, OSError, UnicodeError, RuntimeError) as exc:
                  return [str(exc)]
              return []


          def _low_risk_faults(data: dict) -> List[str]:
              """An empty list is valid: no dependency update skips the review."""
              if LOW_RISK_KEY not in data:
                  return [f"{LOW_RISK_KEY}: missing"]
              names = data[LOW_RISK_KEY]
              if not isinstance(names, list) or not all(
                  isinstance(name, str) and name and "/" not in name for name in names
              ):
                  return [f"{LOW_RISK_KEY}: must be a list of file names"]
              return []


          def faults(root: Path) -> List[str]:
              """Every fault of ``root/ci.json``, in key order then unknown keys; empty
              when the file honours the contract."""
              data, fatal = _load(root)
              if fatal:
                  return [fatal]
              found: List[str] = []
              for key in KEYS:
                  if key not in data:
                      found.append(f"{key}: missing")
                  elif not isinstance(data[key], str):
                      found.append(f"{key}: not a string")
                  elif not data[key].strip():
                      found.append(f"{key}: empty command")
              found.extend(
                  f"{key}: unknown key (allowed: {ALLOWED})"
                  for key in data
                  if key not in ALLOWED_KEYS
              )
              found.extend(_low_risk_faults(data))
              found.extend(_version_faults(data, root))
              return found


          def _export(data: dict, tags: list[str]) -> None:
              outputs = {key: data[key] for key in KEYS}
              outputs["release_tags"] = json.dumps(tags)
              outputs["release_group"] = hashlib.sha256(
                  json.dumps(sorted(tags)).encode()
              ).hexdigest()
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  for key, value in outputs.items():
                      # GitHub multiline output protocol: delimiter cannot occur on its own line.
                      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
                      delimiter = str(uuid.uuid4())
                      while delimiter in value.splitlines():
                          delimiter = str(uuid.uuid4())
                      out.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")


          def main(argv: List[str]) -> int:
              root = Path(argv[0]) if argv else Path(".")
              found = faults(root)
              if found:
                  for line in found:
                      print(line, file=sys.stderr)
                  return 1
              data, _ = _load(root)
              for key in KEYS:
                  print(f"{key}: {data[key]}")
              if RELEASE_KEY in data:
                  print(f"{RELEASE_KEY}: {json.dumps(data[RELEASE_KEY])}")
              else:
                  print(f"{VERSION_KEY}: {data.get(VERSION_KEY, DEFAULT_VERSION_FILE)}")
              if "--github-output" in argv:
                  _export(data, release_tags(data, root))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY

  # The unit command must leave a Cobertura coverage.xml; the reader is
  # tools/ci_coverage.py of zetetic-team-subagents, embedded byte for byte,
  # and fails the step under 90 % of lines (design, Constraints).
  unit:
    needs: contract
    if: >-
      !cancelled()
      && needs.contract.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.tested_sha }}

      - name: Restore Cargo build cache
        id: cargo_cache
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-

      - name: Run the unit command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.unit }}
        run: bash -eo pipefail -c "$CI_COMMAND"

      # Save a successful build even when the independent coverage floor fails.
      # https://github.com/actions/cache/blob/55cc8345863c7cc4c66a329aec7e433d2d1c52a9/save/README.md
      - name: Save Cargo build cache
        if: success() && hashFiles('Cargo.lock') != '' && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}

      - name: Enforce the coverage floor
        run: |
          python3 - coverage.xml --min 90 <<'PY'
          #!/usr/bin/env python3
          """ci_coverage.py -- reads a Cobertura report and fails under a line threshold.

          The single CI (docs/superpowers/specs/2026-10-22-single-ci-design.md,
          "Repository contract: ci.json") makes the ``unit`` step produce Cobertura XML
          at ``coverage.xml`` and fails it under 90 % of lines, the same number for the
          eight repositories. The root element's ``line-rate`` (0 to 1) is the figure
          every producer here writes (coverage.py, cargo-llvm-cov, vitest/istanbul), so
          one reader serves all stacks. Decimal arithmetic keeps 0.899 at 89.90, not at
          a binary neighbour of the threshold.

          This file is also embedded verbatim in ``templates/ci/pipeline.yml`` as an inline
          ``python3 -`` step: standard library only, arguments through ``sys.argv``.

          Usage: ``python3 tools/ci_coverage.py coverage.xml [--min 90]``. Exit 0 at or
          above the minimum, 1 under it, 2 when the report is absent or unreadable (an
          unmeasurable coverage is not a pass).
          """
          from __future__ import annotations

          import argparse
          import sys
          import xml.etree.ElementTree as ET
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          from typing import List

          # source: docs/superpowers/specs/2026-10-22-single-ci-design.md, Constraints
          # ("Coverage threshold: 90 % of lines ... same number for the eight repositories").
          DEFAULT_MIN = Decimal("90")
          # xml.etree stays, not defusedxml: the step must run on a bare runner with the
          # standard library, and the report is written by the repository's own unit
          # command in the same job. ElementTree does not expand external entities
          # (https://docs.python.org/3/library/xml.html#xml-vulnerabilities, "Safe").


          class CoverageError(Exception):
              """The report cannot be read as a Cobertura document with a line-rate."""


          def percent(path: Path) -> Decimal:
              """Line coverage of ``path`` as a percentage with two decimals."""
              if not path.is_file():
                  raise CoverageError(f"{path}: no such file")
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  raise CoverageError(f"{path}: not well-formed XML ({exc})") from exc
              if root.tag != "coverage":
                  raise CoverageError(f"{path}: root element is <{root.tag}>, not <coverage>")
              raw = root.get("line-rate")
              if raw is None:
                  raise CoverageError(f"{path}: <coverage> has no line-rate attribute")
              try:
                  rate = Decimal(raw)
              except InvalidOperation as exc:
                  raise CoverageError(f"{path}: line-rate {raw!r} is not a number") from exc
              return (rate * 100).quantize(Decimal("0.01"))


          def main(argv: List[str]) -> int:
              parser = argparse.ArgumentParser(description="fail when Cobertura line coverage is under a minimum")
              parser.add_argument("report", type=Path, help="Cobertura XML report")
              parser.add_argument("--min", type=Decimal, default=DEFAULT_MIN, help="minimum percentage of lines (default 90)")
              args = parser.parse_args(argv)
              try:
                  value = percent(args.report)
              except CoverageError as exc:
                  print(exc, file=sys.stderr)
                  return 2
              minimum = args.min.quantize(Decimal("0.01"))
              if value < minimum:
                  print(f"coverage: {value}% of lines, under the minimum {minimum}%")
                  return 1
              print(f"coverage: {value}% of lines, minimum {minimum}%")
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY

  regression:
    needs: [contract, unit]
    if: >-
      !cancelled()
      && needs.contract.result == 'success'
      && needs.unit.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.tested_sha }}

      - name: Cache Cargo build
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-

      - name: Run the regression command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.regression }}
        run: bash -eo pipefail -c "$CI_COMMAND"

  e2e:
    needs: [contract, regression]
    if: >-
      !cancelled()
      && needs.contract.result == 'success'
      && needs.regression.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.tested_sha }}

      - name: Cache Cargo build
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-

      - name: Run the e2e command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.e2e }}
        run: bash -eo pipefail -c "$CI_COMMAND"

  # A bare runner (decision 6): the runner image plus the pinned CLI, nothing
  # else installed by the pipeline. CI_OS and CI_WORK are the contract's
  # two variables for the environment and install commands.
  environment:
    needs: [contract, e2e]
    if: >-
      !cancelled()
      && needs.contract.result == 'success'
      && needs.e2e.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.tested_sha }}

      - name: Install the Claude Code CLI
        # source: https://docs.npmjs.com/cli/v11/commands/npm-ci
        run: |
          npm ci --prefix "$GITHUB_WORKSPACE/.github/claude-cli"
          echo "$GITHUB_WORKSPACE/.github/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Scratch directory and OS name
        run: |
          work="$(mktemp -d)"
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -m "$work")"; fi
          case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=macos ;; *) os=windows ;; esac
          { echo "CI_WORK=$work"; echo "CI_OS=$os"; } >> "$GITHUB_ENV"

      - name: Run the environment command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.environment }}
        run: bash -eo pipefail -c "$CI_COMMAND"

  # Fresh HOME and CLAUDE_CONFIG_DIR under the scratch directory: the install
  # command sees a machine that has never run Claude Code.
  install:
    needs: [contract, environment]
    if: >-
      !cancelled()
      && needs.contract.result == 'success'
      && needs.environment.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.tested_sha }}

      - name: Install the Claude Code CLI
        # source: https://docs.npmjs.com/cli/v11/commands/npm-ci
        run: |
          npm ci --prefix "$GITHUB_WORKSPACE/.github/claude-cli"
          echo "$GITHUB_WORKSPACE/.github/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Scratch directory and OS name
        run: |
          work="$(mktemp -d)"
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -m "$work")"; fi
          mkdir -p "$work/home" "$work/claude"
          case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=macos ;; *) os=windows ;; esac
          { echo "CI_WORK=$work"; echo "CI_OS=$os"; } >> "$GITHUB_ENV"

      - name: Run the install command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.install }}
          HOME: ${{ env.CI_WORK }}/home
          USERPROFILE: ${{ env.CI_WORK }}/home
          CLAUDE_CONFIG_DIR: ${{ env.CI_WORK }}/claude
        run: bash -eo pipefail -c "$CI_COMMAND"

  merge:
    # The aggregate of the test jobs of this run: green when they all are. It reads
    # nothing else (no main, no review state, no live PR label).
    needs: [contract, unit, regression, e2e, environment, install]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the test jobs of this run
        env:
          CONTRACT: ${{ needs.contract.result }}
          UNIT: ${{ needs.unit.result }}
          REGRESSION: ${{ needs.regression.result }}
          E2E: ${{ needs.e2e.result }}
          ENVIRONMENT: ${{ needs.environment.result }}
          INSTALL: ${{ needs.install.result }}
        run: |
          blocked=""
          for pair in "contract=$CONTRACT" "unit=$UNIT" "regression=$REGRESSION" "e2e=$E2E" "environment=$ENVIRONMENT" "install=$INSTALL"; do
            case "$pair" in
              *=success) ;;
              *) echo "::error::${pair%%=*}: ${pair#*=}, needs success"; blocked=1 ;;
            esac
          done
          if [ -n "$blocked" ]; then
            echo "## Merge: blocked, a test job is not green on this commit" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## Merge: the test jobs are green on this commit" >> "$GITHUB_STEP_SUMMARY"


  # Decision 1: the release gate that Cortex ran in .github/workflows/ci.yml
  # (Cortex ADR-0802), with validated versions from ci.json. Missing tags are
  # pushed atomically over the deploy key so the tag-triggered release
  # workflows fire.
  tag:
    # Publish only after all five categories pass on the actual merge commit.
    needs: [contract, unit, regression, e2e, environment, install]
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.contract.result == 'success'
      && needs.unit.result == 'success'
      && needs.regression.result == 'success'
      && needs.e2e.result == 'success'
      && needs.environment.result == 'success'
      && needs.install.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-tag-${{ needs.contract.outputs.release_group }}
      cancel-in-progress: false
    steps:
      - name: Guard, skip cleanly when RELEASE_TAG_SSH_KEY is missing
        id: guard
        env:
          SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "RELEASE_TAG_SSH_KEY secret not configured, skipping."
            echo "Add the private half of a write-enabled repository deploy"
            echo "key at Settings -> Secrets and variables -> Actions."
            echo "has_deploy_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_deploy_key=true" >> "$GITHUB_OUTPUT"
          fi

      # No working tree of the tested commit is checked out here. This job holds
      # a write-enabled deploy key and runs after a workflow_run event, so a
      # checkout is the CodeQL finding actions/untrusted-checkout (Cortex PR839,
      # ai-architect-mcp-codebase PR471, high). The publish step needs only the
      # commit object and an authenticated origin: a bare repository with the
      # commit fetched by SHA gives both and executes nothing from the commit.
      # GitHub's SSH host keys are read from api.github.com/meta over TLS at run
      # time (source: docs.github.com, "GitHub's SSH key fingerprints"), the
      # same keys actions/checkout installs, without a hard-coded copy to age.
      - name: Fetch the tested commit into a bare repository
        if: steps.guard.outputs.has_deploy_key == 'true'
        env:
          SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
          TESTED_SHA: ${{ needs.contract.outputs.tested_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TESTED_SHA" in
            *[!0-9a-f]* | '') echo "::error::tested_sha is not a lowercase hex SHA"; exit 1 ;;
          esac
          [ "${#TESTED_SHA}" -eq 40 ] || { echo "::error::tested_sha is not 40 hex chars"; exit 1; }
          key_dir="$RUNNER_TEMP/release-key"
          (umask 077 && mkdir -p "$key_dir" && printf '%s\n' "$SSH_KEY" > "$key_dir/id")
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$key_dir/known_hosts"
          [ -s "$key_dir/known_hosts" ] || { echo "::error::api.github.com/meta returned no SSH host keys"; exit 1; }
          ssh_command="ssh -i $key_dir/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$key_dir/known_hosts -o StrictHostKeyChecking=yes"
          echo "GIT_SSH_COMMAND=$ssh_command" >> "$GITHUB_ENV"
          export GIT_SSH_COMMAND="$ssh_command"
          repo="$RUNNER_TEMP/release-repo"
          git init --quiet --bare "$repo"
          git -C "$repo" remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git -C "$repo" fetch --quiet --depth=1 origin "$TESTED_SHA"
          [ "$(git -C "$repo" cat-file -t "$TESTED_SHA")" = commit ] || { echo "::error::fetched object is not a commit"; exit 1; }

      - name: Set up Python
        if: steps.guard.outputs.has_deploy_key == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Publish declared package tags
        id: publish
        if: steps.guard.outputs.has_deploy_key == 'true'
        working-directory: ${{ runner.temp }}/release-repo
        env:
          RELEASE_TAGS: ${{ needs.contract.outputs.release_tags }}
          TESTED_SHA: ${{ needs.contract.outputs.tested_sha }}
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Publish validated package versions without overwriting an existing tag.

          Source: tasks/package-release-tags.md; git-scm.com/docs/git-push (--atomic).
          Concurrent overlap is retried only after the pending set strictly shrinks.
          """

          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path


          def git(*args, check=True):
              return subprocess.run(["git", *args], text=True, capture_output=True, check=check)


          def validate(tags, sha):
              if not isinstance(sha, str) or re.fullmatch(r"[0-9a-f]{40}", sha) is None:
                  raise ValueError("Release target must be a full commit SHA")
              if git("cat-file", "-t", sha).stdout.strip() != "commit":
                  raise ValueError("Release target must name a commit object")
              if (
                  not isinstance(tags, list)
                  or not tags
                  or any(not isinstance(t, str) or not t for t in tags)
              ):
                  raise ValueError("release_tags must be a nonempty list of tag names")
              if len(set(tags)) != len(tags):
                  raise ValueError("duplicate release tags")
              for tag in tags:
                  git("check-ref-format", "refs/tags/" + tag)
                  if any(other != tag and other.startswith(tag + "/") for other in tags):
                      raise ValueError("conflicting release tag refs")


          def remote_existing(tags):
              refs = {"refs/tags/" + tag: tag for tag in tags}
              output = git("ls-remote", "--refs", "origin", *refs).stdout
              return {
                  refs[line.split()[1]]
                  for line in output.splitlines()
                  if len(line.split()) == 2 and line.split()[1] in refs
              }


          def prepare_local(tags, sha):
              for tag in tags:
                  ref = "refs/tags/" + tag
                  found = git("show-ref", "--verify", "--quiet", ref, check=False)
                  if found.returncode == 0:
                      if git("rev-parse", ref + "^{}").stdout.strip() != sha:
                          raise ValueError("Local unpublished tag points elsewhere: " + tag)
                  elif found.returncode == 1:
                      git(
                          "-c",
                          "user.name=github-actions[bot]",
                          "-c",
                          "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                          "tag",
                          "-a",
                          "-m",
                          "Release " + tag,
                          "--",
                          tag,
                          sha,
                      )
                  else:
                      raise subprocess.CalledProcessError(
                          found.returncode, found.args, stderr=found.stderr
                      )


          def publish(tags, sha):
              existing = remote_existing(tags)
              pending = set(tags) - existing
              while pending:
                  prepare_local(sorted(pending), sha)
                  refs = [f"refs/tags/{tag}:refs/tags/{tag}" for tag in sorted(pending)]
                  result = git("push", "--atomic", "origin", *refs, check=False)
                  if result.returncode == 0:
                      return sorted(pending), sorted(existing)
                  remaining = pending - remote_existing(sorted(pending))
                  if not remaining < pending:
                      raise subprocess.CalledProcessError(
                          result.returncode, result.args, stderr=result.stderr
                      )
                  existing.update(pending - remaining)
                  pending = remaining
              return [], sorted(existing)


          def main():
              try:
                  tags = json.loads(os.environ["RELEASE_TAGS"])
                  sha = os.environ["TESTED_SHA"]
                  validate(tags, sha)
                  published, existing = publish(tags, sha)
              except (ValueError, OSError, KeyError, subprocess.CalledProcessError) as exc:
                  print(getattr(exc, "stderr", None) or str(exc), file=sys.stderr)
                  return 1
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
                  for tag in published:
                      out.write(f"Published {tag} at {sha}\n")
                  for tag in existing:
                      out.write(f"Existing {tag}: target preserved\n")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Summarize missing release key
        if: steps.guard.outputs.has_deploy_key != 'true'
        run: echo "## Release gate skipped, RELEASE_TAG_SSH_KEY not configured" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failed release publication
        if: failure() && steps.guard.outputs.has_deploy_key == 'true'
        run: echo "## Release gate failed; no publication success is claimed" >> "$GITHUB_STEP_SUMMARY"
