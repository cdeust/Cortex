# generated by zetetic-team-subagents render-ci (bootstrap, template pending on feat/single-ci-template)
# source: ADR-1115
#
# One pipeline for every pull request: contract -> unit -> regression -> e2e
# -> environment -> install -> review (the Claude bot) -> merge, and a release
# tag on push to main. The commands come from ci.json at the repository root.
name: Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Claude Code CLI the environment and install legs run with (Cortex's measured pin).
  # GH_TOKEN on the test jobs: the runner's gh is unauthenticated without it.
  CLAUDE_CODE_VERSION: "2.1.296"

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ci.json: exactly unit, regression, e2e, environment, install (non-empty
      # shell commands) plus an optional version_file that must exist. An
      # empty step is a failure, never a pass.
      - name: Validate ci.json
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          KEYS = ("unit", "regression", "e2e", "environment", "install")
          VERSION_KEY, DEFAULT_VERSION_FILE = "version_file", ".claude-plugin/plugin.json"
          path = Path("ci.json")
          faults = []
          data = None
          if not path.is_file():
              faults.append("ci.json: missing")
          else:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except ValueError as exc:
                  faults.append(f"ci.json: not valid JSON ({exc})")
              if data is not None and not isinstance(data, dict):
                  faults.append("ci.json: must be a JSON object")
                  data = None
          if data is not None:
              for key in KEYS:
                  if key not in data:
                      faults.append(f"{key}: missing")
                  elif not isinstance(data[key], str):
                      faults.append(f"{key}: not a string")
                  elif not data[key].strip():
                      faults.append(f"{key}: empty command")
              allowed = KEYS + (VERSION_KEY,)
              faults.extend(f"{key}: unknown key (allowed: {', '.join(allowed)})" for key in data if key not in allowed)
              version_file = data.get(VERSION_KEY, DEFAULT_VERSION_FILE)
              if not isinstance(version_file, str) or not version_file.strip():
                  faults.append(f"{VERSION_KEY}: not a non-empty string")
              elif not Path(version_file).is_file():
                  faults.append(f"{VERSION_KEY}: {version_file} does not exist")
          for line in faults:
              print(f"::error::{line}")
          if faults:
              sys.exit(1)
          for key in KEYS:
              print(f"{key}: {data[key]}")
          print(f"{VERSION_KEY}: {data.get(VERSION_KEY, DEFAULT_VERSION_FILE)}")
          PY

  unit:
    name: unit
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the unit command
        run: bash -eo pipefail -c "$(jq -r .unit ci.json)"

      # Cobertura line-rate of coverage.xml, 90 % of lines minimum, the same
      # number for every repository. An unreadable report is not a pass.
      - name: Fail under 90 % of lines
        run: |
          python3 - coverage.xml 90 <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET  # stdlib: no external entities, bare runner
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          report, minimum = Path(sys.argv[1]), Decimal(sys.argv[2])
          if not report.is_file():
              sys.exit(f"::error::{report}: no such file (the unit command must write it)")
          try:
              root = ET.parse(report).getroot()
          except ET.ParseError as exc:
              sys.exit(f"::error::{report}: not well-formed XML ({exc})")
          if root.tag != "coverage" or root.get("line-rate") is None:
              sys.exit(f"::error::{report}: not a Cobertura report with a line-rate")
          try:
              value = (Decimal(root.get("line-rate")) * 100).quantize(Decimal("0.01"))
          except InvalidOperation:
              sys.exit(f"::error::{report}: line-rate {root.get('line-rate')!r} is not a number")
          line = f"coverage: {value}% of lines, minimum {minimum}%"
          print(line)
          with open(os.environ.get("GITHUB_STEP_SUMMARY", os.devnull), "a") as summary:
              summary.write(f"## {line}\n")
          if value < minimum:
              sys.exit(f"::error::{line}: under the minimum")
          PY

  regression:
    name: regression
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the regression command
        run: bash -eo pipefail -c "$(jq -r .regression ci.json)"

  e2e:
    name: e2e
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the e2e command
        run: bash -eo pipefail -c "$(jq -r .e2e ci.json)"

  # Bare runner: the GitHub image plus the pinned Claude Code CLI, nothing
  # else. A product that needs more is red on that OS, by design.
  environment:
    name: environment (${{ matrix.os }})
    needs: e2e
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CI_OS: ${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || 'windows' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Claude Code CLI (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" && claude --version

      - name: Run the environment command
        run: |
          CI_WORK="$RUNNER_TEMP/ci-work"
          if command -v cygpath >/dev/null 2>&1; then CI_WORK="$(cygpath -m "$RUNNER_TEMP")/ci-work"; fi
          rm -rf "$CI_WORK" && mkdir -p "$CI_WORK"
          export CI_WORK
          bash -eo pipefail -c "$(jq -r .environment ci.json)"

  install:
    name: install (${{ matrix.os }})
    needs: environment
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CI_OS: ${{ matrix.os == 'ubuntu-latest' && 'linux' || matrix.os == 'macos-latest' && 'macos' || 'windows' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Claude Code CLI (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" && claude --version

      # A fresh HOME and CLAUDE_CONFIG_DIR: the install must work on a machine
      # that has never seen the product.
      - name: Run the install command in a fresh HOME
        run: |
          CI_WORK="$RUNNER_TEMP/ci-work"
          if command -v cygpath >/dev/null 2>&1; then CI_WORK="$(cygpath -m "$RUNNER_TEMP")/ci-work"; fi
          rm -rf "$CI_WORK" && mkdir -p "$CI_WORK/home/.claude"
          export CI_WORK HOME="$CI_WORK/home" CLAUDE_CONFIG_DIR="$CI_WORK/home/.claude"
          bash -eo pipefail -c "$(jq -r .install ci.json)"

  # The Claude bot reviews, then fixes and pushes. Runs after install whether
  # it passed or failed; same-repo pull requests only, never a draft, never a
  # Dependabot pull request (out of the bot's scope, merges on green tests).
  review:
    name: review
    needs: [contract, unit, regression, e2e, environment, install]
    if: >-
      always()
      && needs.contract.result == 'success'
      && github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # Keyed on the head SHA: skipped when the bot authored the head commit
      # (loop guard) or when the diff touches this workflow (the action does
      # not run a workflow that differs from main). Also lists the failed
      # jobs of this run for the fix step.
      - name: Guard, keyed on the head SHA
        id: guard
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          author="$(git log -1 --format='%an <%ae>' "$HEAD_SHA")"
          reason=""
          case "$author" in
            *"claude[bot]"*) reason="head commit authored by the bot ($author)" ;;
          esac
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qx '.github/workflows/pipeline.yml'; then
            reason="${reason:+$reason; }the diff touches .github/workflows/pipeline.yml"
          fi
          failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | "- \(.name): \(.html_url)"')"
          {
            echo "failed<<EOF"
            echo "${failed:-none}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "## Review: skipped, $reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Review (code-review plugin)
        if: steps.guard.outputs.run == 'true'
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

      - name: Fix (review findings and failed jobs)
        if: steps.guard.outputs.run == 'true'
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the fix step of the Pipeline workflow of ${{ github.repository }},
            pull request #${{ github.event.pull_request.number }}, branch
            ${{ github.event.pull_request.head.ref }}, head ${{ github.event.pull_request.head.sha }}.
            The branch is checked out. The pipeline runs, in order: unit, regression,
            e2e, environment and install, with the commands of ci.json.

            Failed jobs of run ${{ github.run_id }} ("none" when every test passed):
            ${{ steps.guard.outputs.failed }}

            1. Read the review comments on the pull request (gh pr view, gh api
               repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments)
               and the logs of every failed job (gh run view ${{ github.run_id }} --log-failed).
            2. Apply every review finding and fix every test failure on this branch.
               Fix the product; change .github/workflows/pipeline.yml or ci.json only
               when a finding is about them.
            3. Run the tests you touched with the matching ci.json command.
            4. Commit with a message that names what was fixed, and push to the branch.
               Change nothing and push nothing when there is nothing to fix.
          claude_args: '--allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(pytest:*),Bash(uv:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(cargo:*),Bash(bash:*)"'

  # Arms the squash auto-merge when the five test jobs passed on this commit
  # and review did not fail (a skip by design does not block). Always runs on
  # a same-repo, non-draft pull request and FAILS explicitly otherwise: a
  # skipped required check counts as satisfied for GitHub (measured on
  # claude-mods #38 and session-optimizer #73, auto-merged on a red run).
  merge:
    name: merge
    needs: [unit, regression, e2e, environment, install, review]
    if: >-
      always()
      && github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refuse unless the five test jobs succeeded and review did not fail
        env:
          UNIT: ${{ needs.unit.result }}
          REGRESSION: ${{ needs.regression.result }}
          E2E: ${{ needs.e2e.result }}
          ENVIRONMENT: ${{ needs.environment.result }}
          INSTALL: ${{ needs.install.result }}
          REVIEW: ${{ needs.review.result }}
        run: |
          red=""
          for job in UNIT REGRESSION E2E ENVIRONMENT INSTALL; do
            if [ "${!job}" != "success" ]; then red="$red $job=${!job}"; fi
          done
          if [ "$REVIEW" = "failure" ]; then red="$red REVIEW=failure"; fi
          if [ -n "$red" ]; then
            echo "::error::merge refused:$red"
            echo "## Merge: refused ($red)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## Merge: armed (unit, regression, e2e, environment, install green; review $REVIEW)" >> "$GITHUB_STEP_SUMMARY"

      - name: Arm the squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash

  # source: ADR-1115, ADR-0802
  # Release gate on push to main: tags vX.Y.Z from the version file when the
  # tag does not exist yet, over the write-enabled deploy key so the
  # tag-triggered release workflows fire.
  tag:
    name: tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - name: Guard, skip cleanly when RELEASE_TAG_SSH_KEY is missing
        id: guard
        env:
          SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "RELEASE_TAG_SSH_KEY secret not configured, skipping."
            echo "Add the private half of a write-enabled repository deploy"
            echo "key at Settings -> Secrets and variables -> Actions."
            echo "has_deploy_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_deploy_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the SHA that just went green
        if: steps.guard.outputs.has_deploy_key == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_TAG_SSH_KEY }}

      - name: Set up Python
        if: steps.guard.outputs.has_deploy_key == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve the version and check for an existing tag
        id: tag_check
        if: steps.guard.outputs.has_deploy_key == 'true'
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          import doc_claim_sources
          print(doc_claim_sources.canonical_version(lambda p: open(p, encoding='utf-8').read()))
          ")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} already exists: this push carries no version bump"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "no existing tag v${VERSION}: this push is a version bump"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version surfaces
        if: steps.guard.outputs.has_deploy_key == 'true' && steps.tag_check.outputs.exists == 'false'
        run: python scripts/check_version_surfaces.py
      - name: Configure git identity
        if: steps.guard.outputs.has_deploy_key == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push the release tag
        if: steps.guard.outputs.has_deploy_key == 'true' && steps.tag_check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.tag_check.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "v${VERSION}" -m "Release v${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/v${VERSION}"

      - name: Summarize the release-gate decision
        if: always()
        env:
          HAS_KEY: ${{ steps.guard.outputs.has_deploy_key }}
          EXISTS: ${{ steps.tag_check.outputs.exists }}
          VERSION: ${{ steps.tag_check.outputs.version }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "## Release gate: skipped, RELEASE_TAG_SSH_KEY not configured" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EXISTS" == "true" ]; then
            echo "## Release gate: skipped, v${VERSION} already tagged (no version bump on this push)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Release gate: tagged v${VERSION} at \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
