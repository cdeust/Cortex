name: Pipeline after merge

# GitHub rejects a workflow listening to itself (run40017492191).
# The local reusable retains this caller's workflow_run event context.
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#github-context
on:
  workflow_run:
    workflows: [Pipeline]
    types: [completed]
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  pipeline:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    # Only the completion engine is callable. It has no PR review job or OAuth
    # secret. Its jobs narrow these permissions; no caller concurrency.
    permissions:
      contents: write
      pull-requests: write
      actions: read
    uses: ./.github/workflows/pipeline-post-merge.yml
    secrets:
      RELEASE_TAG_SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
