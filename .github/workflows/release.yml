name: Release

# Cortex's SUPPORTED install path is Anthropic's plugin marketplace
# (`/plugin install hypermnesia-mcp@cortex-plugins`). The marketplace consumes the
# git tree directly via ``${CLAUDE_PLUGIN_ROOT}``. See ADR-0050.
#
# PyPI is a DEPRECATED secondary channel, kept best-effort for legacy
# `pip install` / `uvx` users. It is NOT the supported path and may lag
# or be removed. The publish-pypi job below is intentionally
# non-blocking: if PyPI rejects the upload (e.g. the Trusted Publisher
# entry was removed), the GitHub Release + marketplace propagation still
# succeed. Publishing uses PEP 740 Trusted Publishing (OIDC) against the
# trusted-publisher entry configured for this workflow + environment
# `pypi` — the same one that published versions up to 3.14.7.
#
# This workflow runs the tests on tag push, creates a GitHub Release with
# auto-generated notes, and (best-effort) publishes to the deprecated
# PyPI channel.
#
# Supply-chain hardening (issue #178). Cortex reads and persists every
# session transcript and installs session hooks with the user's full
# filesystem access; a substituted wheel is a keylogger on the user's
# work, and until now the wheel shipped with nothing a user could verify.
# This workflow now:
#   * attests build provenance for the wheel, the sdist and the SBOM
#     (Sigstore-backed; verify with `gh attestation verify <file>
#     --repo cdeust/Cortex`);
#   * publishes a CycloneDX SBOM generated from uv.lock, so the ML stack
#     (torch/transformers/scipy/scikit-learn) — the bulk of the attack
#     surface — is enumerable rather than opaque;
#   * publishes a `<asset>.sha256` companion for every GitHub Release
#     asset, verified on download by scripts/verify_release_artifact.py;
#   * pins every third-party action to a commit SHA (a floating tag in the
#     job that builds and signs releases is a live supply-chain hole).
# PyPI keeps PEP 740 attestations (native to Trusted Publishing) in
# addition to the GitHub attestations above.

on:
  push:
    tags:
      - "v*"

# Least privilege at the top level; jobs that mint OIDC tokens widen it
# locally (issue #178). `contents: write` is the release-upload scope.
permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://cortex:cortex@localhost:5432/cortex

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Runner-local PostgreSQL + pgvector (no Docker Hub pull). See ci.yml for
      # the rationale: anonymous registry-1.docker.io pulls are rate-limited and
      # outage-prone; PGDG apt is the canonical, unmetered pgvector source.
      - name: Set up PostgreSQL + pgvector (runner-local, no registry pull)
        run: |
          set -euxo pipefail
          sudo systemctl start postgresql
          PG_VER="$(pg_lsclusters -h | awk 'NR==1 {print $1}')"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          for i in 1 2 3; do sudo apt-get install -y "postgresql-${PG_VER}-pgvector" && break || sleep 5; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE cortex LOGIN SUPERUSER PASSWORD 'cortex';"
          sudo -u postgres createdb -O cortex cortex
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d cortex \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
          for i in $(seq 1 30); do
            PGPASSWORD=cortex pg_isready -h localhost -U cortex -d cortex && break || sleep 1
          done
          PGPASSWORD=cortex psql -h localhost -U cortex -d cortex -c "SELECT version();"

      - name: Cache HuggingFace models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2

      - name: Install dependencies
        run: pip install -e ".[dev,postgresql]"

      - name: Pre-download embedding model
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2', device='cpu')"
        continue-on-error: true

      - name: Run tests
        run: pytest --tb=short -q

  github-release:
    name: GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release + attach auto-generated notes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          # Write to file to avoid escaping issues
          echo "$CHANGELOG" > changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: changelog.txt
          generate_release_notes: true

  # ── DEPRECATED PyPI channel (best-effort) ──────────────────────────────
  # Restored after being dropped in a2dc7e3. Marketplace (ADR-0050) is the
  # supported path; these jobs keep the legacy `pip install` / `uvx` users
  # on a non-vulnerable version. Decoupled from github-release so a PyPI
  # failure never blocks the supported channel.
  build:
    name: Build sdist + wheel + attest (deprecated PyPI channel)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload attested wheel/sdist + checksums to release
      id-token: write       # OIDC token Sigstore exchanges for a signing cert
      attestations: write   # record the build-provenance statement on the repo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      # Checksums for every artifact BEFORE attestation and upload, so the
      # `<asset>.sha256` a user verifies with scripts/verify_release_artifact.py
      # describes exactly the bytes that were attested (issue #178 criterion 4).
      - name: Compute SHA-256 checksums
        run: |
          set -euxo pipefail
          cd dist
          for f in *; do
            sha256sum "$f" | tee "$f.sha256"
          done
          ls -la

      # Provenance BEFORE upload: the attestation binds each artifact digest to
      # this workflow, commit and runner. Verify with
      #   gh attestation verify <file> --repo cdeust/Cortex
      - name: Attest build provenance (wheel + sdist)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload build artifacts (for the PyPI job)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          # Only the distributions go to PyPI; the .sha256 companions are
          # GitHub-release assets, excluded here so twine sees a clean dist/.
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attach attested distributions + checksums to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true

  # CycloneDX SBOM for the FULL dependency graph (issue #178 criterion 3).
  # Generated from uv.lock via `uv export`, so it lists the exact versions the
  # release resolves to — including torch/transformers/scipy/scikit-learn,
  # which arrive transitively through sentence-transformers and are the bulk
  # of the attack surface. Deriving it from the lock (not a live install)
  # keeps the job bounded and reproducible: "what is in this distribution" is
  # answered from the same lock the wheel is built against, and the several-
  # hundred-MB torch download is not on the critical path.
  sbom:
    name: SBOM (CycloneDX, from uv.lock)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload SBOM + checksum to the release
      id-token: write       # OIDC for attestation
      attestations: write   # record the provenance statement
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv (pinned) + cyclonedx
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Export the locked graph and build the SBOM
        run: |
          set -euxo pipefail
          # Full transitive graph, all extras, pinned to uv.lock. --no-emit-project
          # drops the local package's own editable line so cyclonedx sees only
          # third-party components. --no-hashes because cyclonedx-py records the
          # component set, not the wheel hashes (those live in the .sha256 files).
          uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes \
            --format requirements-txt > sbom-requirements.txt
          wc -l sbom-requirements.txt
          # cyclonedx-py ships in the cyclonedx-bom distribution.
          uv tool run --from cyclonedx-bom cyclonedx-py requirements \
            sbom-requirements.txt --output-format JSON --output-file hypermnesia-mcp.cdx.json
          # Fail loudly if the ML stack is somehow absent — criterion 3 names it.
          for pkg in torch transformers scipy scikit-learn; do
            grep -q "\"name\": \"$pkg\"" hypermnesia-mcp.cdx.json \
              || { echo "SBOM missing expected component: $pkg" >&2; exit 1; }
          done
          sha256sum hypermnesia-mcp.cdx.json | tee hypermnesia-mcp.cdx.json.sha256
          ls -la hypermnesia-mcp.cdx.json*

      - name: Attest build provenance (SBOM)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: hypermnesia-mcp.cdx.json

      - name: Upload SBOM + checksum to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            hypermnesia-mcp.cdx.json
            hypermnesia-mcp.cdx.json.sha256
          fail_on_unmatched_files: true

  publish-pypi:
    name: Publish to PyPI (deprecated channel)
    needs: build
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing — no stored secret. Verified by PyPI against
    # the trusted-publisher entry for (cdeust/Cortex, release.yml,
    # environment=pypi). This is the same entry that published <= 3.14.7.
    environment:
      name: pypi
      url: https://pypi.org/p/hypermnesia-mcp
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (best-effort — must not fail the release)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        # Deprecated channel: a rejected upload (already-exists, or the
        # Trusted Publisher entry was removed) must NOT red-X the release.
        continue-on-error: true
        with:
          verbose: true
          # PEP 740 attestations are ON by default here (id-token: write is
          # present); the package page shows a verified build alongside the
          # GitHub attestations minted in the build job.
          #
          # skip-existing so a retag against an already-published version
          # is a no-op instead of a hard failure — this was the exact
          # failure mode that motivated removing PyPI in a2dc7e3.
          skip-existing: true
