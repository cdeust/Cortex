#
# source: ADR-0808





on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# source: ADR-0808

permissions:
  contents: read

jobs:
  github-release:
    name: GitHub Release
    # source: ADR-0808








    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # source: ADR-0808
    timeout-minutes: 2
    permissions:
      contents: write  # create the release + attach auto-generated notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # source: ADR-0808
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" "${PREV_TAG}"..HEAD)
          fi
          # source: ADR-0808
          echo "$CHANGELOG" > changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: changelog.txt
          generate_release_notes: true

  # source: ADR-0808




  build:
    name: Build sdist + wheel + attest (PyPI compatibility)
    # source: ADR-0808



    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # source: ADR-0808
    timeout-minutes: 2
    permissions:
      contents: write       # upload attested wheel/sdist + checksums to release
      id-token: write       # OIDC token Sigstore exchanges for a signing cert
      attestations: write   # record the build-provenance statement on the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        # source: ADR-0808




        run: pip install --no-deps --require-hashes -r requirements/packaging.txt

      - name: Build sdist and wheel
        run: python -m build

      # source: ADR-0808


      - name: Compute SHA-256 checksums
        run: |
          set -euxo pipefail
          cd dist
          for f in *; do
            sha256sum "$f" | tee "$f.sha256"
          done
          ls -la

      # Provenance BEFORE upload: the attestation binds each artifact digest to
      # this workflow, commit and runner. Verify with
      #   gh attestation verify <file> --repo cdeust/Cortex
      - name: Attest build provenance (wheel + sdist)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload build artifacts (for the PyPI job)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          # source: ADR-0808

          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attach attested distributions + checksums to the GitHub Release
        # source: ADR-0808


        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true

  # source: ADR-0808







  sbom:
    name: SBOM (CycloneDX, from uv.lock)
    # source: ADR-0808


    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # source: ADR-0808
    timeout-minutes: 2
    permissions:
      contents: write       # upload SBOM + checksum to the release
      id-token: write       # OIDC for attestation
      attestations: write   # record the provenance statement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv (pinned) + cyclonedx
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Export the locked graph and build the SBOM
        run: |
          set -euxo pipefail
          # source: ADR-0808
          #
          #
          #
          uv export --frozen --all-extras --no-dev --no-emit-project --no-hashes \
            --format requirements-txt > sbom-requirements.txt
          wc -l sbom-requirements.txt
          # cyclonedx-py ships in the cyclonedx-bom distribution.
          uv tool run --from cyclonedx-bom cyclonedx-py requirements \
            sbom-requirements.txt --output-format JSON --output-file hypermnesia-mcp.cdx.json
          # Fail if the ML stack is absent.
          # source: ADR-0808
          for pkg in torch transformers scipy scikit-learn; do
            grep -q "\"name\": \"$pkg\"" hypermnesia-mcp.cdx.json \
              || { echo "SBOM missing expected component: $pkg" >&2; exit 1; }
          done
          sha256sum hypermnesia-mcp.cdx.json | tee hypermnesia-mcp.cdx.json.sha256
          ls -la hypermnesia-mcp.cdx.json*

      - name: Attest build provenance (SBOM)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: hypermnesia-mcp.cdx.json

      - name: Upload SBOM + checksum to the GitHub Release
        # source: ADR-0808

        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            hypermnesia-mcp.cdx.json
            hypermnesia-mcp.cdx.json.sha256
          fail_on_unmatched_files: true

  # source: ADR-0808



  #
  # source: ADR-0808




  mcpb-bundle:
    name: MCPB bundle + attest (Claude Desktop connector)
    # source: ADR-0808


    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # source: ADR-0808
    timeout-minutes: 1
    permissions:
      contents: write       # upload bundle + checksum + server.json to release
      id-token: write       # OIDC token Sigstore exchanges for a signing cert
      attestations: write   # record the build-provenance statement on the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # source: ADR-0808





      - name: Install the pinned MCPB CLI
        run: npm ci --prefix .github/mcpb --ignore-scripts

      - name: Build the MCPB bundle
        id: pack
        run: |
          set -euxo pipefail
          VERSION="$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")"
          # Require the tag to describe the build tree.
          # source: ADR-0808
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "manifest.json version ${VERSION} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          BUNDLE="hypermnesia-mcp-${VERSION}.mcpb"
          node .github/mcpb/node_modules/.bin/mcpb pack . "${BUNDLE}"
          sha256sum "${BUNDLE}" | tee "${BUNDLE}.sha256"
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -la "${BUNDLE}"*

      # Emit the registry variant containing the built MCPB URL and digest alongside the PyPI package.
      # source: ADR-0808
      - name: Emit the resolved server.json (pypi + mcpb packages)
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib

          bundle = pathlib.Path(os.environ["BUNDLE"])
          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]

          doc = json.loads(pathlib.Path("server.json").read_text())
          if doc["version"] != version:
              raise SystemExit(f"server.json {doc['version']} != manifest {version}")

          doc["packages"].append(
              {
                  "registryType": "mcpb",
                  "identifier": (
                      f"https://github.com/{repo}/releases/download/{tag}/{bundle.name}"
                  ),
                  "version": version,
                  "fileSha256": hashlib.sha256(bundle.read_bytes()).hexdigest(),
                  "transport": {"type": "stdio"},
              }
          )
          out = pathlib.Path("server.resolved.json")
          # source: ADR-0808
          #
          out.write_text(json.dumps(doc, indent=2, ensure_ascii=False) + "\n")
          print(out.read_text())
          PY
        env:
          BUNDLE: ${{ steps.pack.outputs.bundle }}
          VERSION: ${{ steps.pack.outputs.version }}

      # source: ADR-0808


      - name: Attest build provenance (MCPB bundle)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.bundle }}

      - name: Attach bundle + checksum + resolved server.json to the release
        # source: ADR-0808

        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pack.outputs.bundle }}
            ${{ steps.pack.outputs.bundle }}.sha256
            server.resolved.json
          fail_on_unmatched_files: true

  publish-pypi:
    name: Publish to PyPI (best-effort compatibility)
    needs: build
    # source: ADR-0808


    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # source: ADR-0808
    timeout-minutes: 1
    # Publish with the configured PyPI OIDC trusted publisher.
    # source: ADR-0808
    environment:
      name: pypi
      url: https://pypi.org/p/hypermnesia-mcp
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (best-effort — must not fail primary release)
        # source: ADR-0808




        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # Treat this upload channel as best-effort.
        # source: ADR-0808
        continue-on-error: true
        with:
          verbose: true
          # source: ADR-0808


          #
          # source: ADR-0808


          skip-existing: true

  # source: ADR-0808









  #
  # source: ADR-0808







  publish-mcp-registry:
    name: Publish to the MCP registry (best-effort compatibility)
    # source: ADR-0808










    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # source: ADR-0808
    timeout-minutes: 1
    permissions:
      id-token: write   # OIDC — mcp-publisher login github-oidc
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify server.json matches the tag (same guard as mcpb-bundle)
        run: |
          set -euxo pipefail
          VERSION="$(python3 -c "import json;print(json.load(open('server.json'))['version'])")"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "server.json version ${VERSION} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      # source: ADR-0808



      - name: Install mcp-publisher (pinned release, checksum-verified)
        run: |
          set -euxo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

      - name: Authenticate to the MCP registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP registry (best-effort — must not fail primary release)
        # source: ADR-0808







        continue-on-error: true
        run: ./mcp-publisher publish
