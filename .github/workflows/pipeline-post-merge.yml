# generated by zetetic-team-subagents render-ci
name: Pipeline post-merge tests

# The single CI of docs/superpowers/specs/2026-10-22-single-ci-design.md:
# contract, unit, regression, e2e, environment, install, merge on a
# pull request; five tests then tag on main or a resolved merge SHA. Rendered by
# zetetic-team-subagents `scripts/setup.sh render-ci`: edit the template.

on:
  workflow_call:
    secrets:
      RELEASE_TAG_SSH_KEY:
        required: false

permissions:
  contents: read

# Git Bash on Windows, so every ci.json command is one shell on the three OS.
defaults:
  run:
    shell: bash

concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # source: claude-mods PR45, unit job119805310369 passed with 2.1.306.
  CLAUDE_CODE_VERSION: "2.1.306"

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      tested_sha: ${{ steps.resolve.outputs.tested_sha }}
      run_tests: ${{ steps.resolve.outputs.run_tests }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve protected merge
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Resolve a completed PR Pipeline to its protected merge commit.

          The PR's required merge job validates eligibility. This workflow_run merges
          synchronously after that check completes, without polling or rule bypass.
          Sources:
          https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
          https://docs.github.com/en/rest/pulls/pulls#merge-a-pull-request
          """

          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen


          class PostMergeError(Exception):
              """The event cannot authorize a protected merge or a tested commit."""


          class GitHub:
              def __init__(self, token: str):
                  if not token:
                      raise PostMergeError("GH_TOKEN is required")
                  self.token = token

              def request(self, method: str, path: str, body=None):
                  request = Request(
                      "https://api.github.com" + path,
                      data=json.dumps(body).encode("utf-8") if body is not None else None,
                      method=method,
                      headers={
                          "Authorization": "Bearer " + self.token,
                          "Accept": "application/vnd.github+json",
                          "Content-Type": "application/json",
                      },
                  )
                  try:
                      with urlopen(request) as response:
                          return json.load(response)
                  except HTTPError as exc:
                      # Never print headers or the untrusted response body.
                      raise PostMergeError(f"GitHub {method} {path}: HTTP {exc.code}") from exc
                  except (URLError, ValueError) as exc:
                      raise PostMergeError(
                          f"GitHub {method} {path}: unreadable response"
                      ) from exc

              def records(self, path: str, key: str | None = None):
                  # Pagination only, not retries or polling. REST per_page maximum is 100.
                  # https://docs.github.com/en/rest/using-the-rest-api/using-pagination-in-the-rest-api
                  page = 1
                  while True:
                      separator = "&" if "?" in path else "?"
                      data = self.request("GET", f"{path}{separator}per_page=100&page={page}")
                      rows = data.get(key) if key and isinstance(data, dict) else data
                      if not isinstance(rows, list):
                          raise PostMergeError("GitHub returned an invalid record list")
                      yield from rows
                      if len(rows) < 100:
                          return
                      page += 1


          def require(condition, message):
              if not condition:
                  raise PostMergeError(message)


          def full_sha(value):
              require(
                  isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value),
                  "GitHub did not return a full commit SHA",
              )
              return value


          def _validate_run(run, repository):
              require(isinstance(run, dict), "missing workflow_run")
              require(run.get("event") == "pull_request", "source event is not pull_request")
              require(
                  run.get("status") == "completed" and run.get("conclusion") == "success",
                  "source Pipeline did not complete successfully",
              )
              require(
                  run.get("head_repository", {}).get("full_name") == repository,
                  "source head repository differs",
              )
              require(
                  run.get("path") == ".github/workflows/pipeline.yml"
                  and run.get("name") == "Pipeline",
                  "source workflow differs",
              )
              require(
                  run.get("head_branch") not in (None, "", "main"),
                  "source must be a PR branch outside main",
              )
              require(type(run.get("id")) is int and run["id"] > 0, "invalid source run ID")
              require(
                  type(run.get("run_attempt")) is int and run["run_attempt"] > 0,
                  "invalid source run attempt",
              )
              full_sha(run.get("head_sha"))


          # source: the matrix of the environment and install jobs of pipeline.yml.
          RUNNERS = ("ubuntu-latest", "macos-latest", "windows-latest")


          def _validate_jobs(jobs):
              # Owner rule 2026-10-29: the required jobs are the tests and their
              # aggregate `merge`; the Claude verdict is read by
              # _review_approves. Overall success alone accepts skipped jobs.
              # ADR-1133: environment and install ran on the three systems, or both on
              # Linux alone. True is returned for Linux alone: resolve() then requires a
              # documentation-only pull request.
              required = ["contract", "unit", "regression", "e2e", "merge"]
              shapes = set()
              for category in ("environment", "install"):
                  full = {f"{category} ({runner})" for runner in RUNNERS}
                  linux = {f"{category} ({RUNNERS[0]})"}
                  actual = [
                      job.get("name", "")
                      for job in jobs
                      if job.get("name", "").startswith(category + " (")
                  ]
                  require(
                      len(actual) == len(set(actual)) and set(actual) in (full, linux),
                      f"source merge gate requires the exact {category} matrix",
                  )
                  shapes.add(len(actual))
                  required.extend(sorted(actual))
              require(
                  len(shapes) == 1,
                  "source merge gate requires the same environment and install matrices",
              )
              for name in required:
                  matching = [job for job in jobs if job.get("name") == name]
                  require(
                      len(matching) == 1, f"source merge gate requires exactly one {name} job"
                  )
                  job = matching[0]
                  allowed = job.get("conclusion") == "success"
                  require(
                      job.get("status") == "completed" and allowed,
                      f"source merge gate requires completed {name}",
                  )
              return shapes == {1}


          def _pr_identity(pr, repository, head):
              require(
                  pr.get("head", {}).get("repo", {}).get("full_name") == repository,
                  "PR head repository differs",
              )
              require(
                  pr.get("base", {}).get("repo", {}).get("full_name") == repository
                  and pr.get("base", {}).get("ref") == "main",
                  "PR base is not this main",
              )
              require(pr.get("head", {}).get("sha") == head, "PR head advanced after testing")


          def _effective_jobs(rows, run):
              # GitHub list-jobs filter=all includes jobs retained from earlier attempts.
              # source: https://docs.github.com/en/rest/actions/workflow-jobs#list-jobs-for-a-workflow-run
              indexed, identities = {}, set()
              for job in rows:
                  attempt, identity, name = job.get("run_attempt"), job.get("id"), job.get("name")
                  require(type(attempt) is int and 0 < attempt <= run["run_attempt"],
                          "invalid job attempt")
                  require(type(identity) is int and identity > 0 and identity not in identities,
                          "invalid or duplicate job identity")
                  require(job.get("run_id") == run["id"] and job.get("head_sha") == run["head_sha"],
                          "job source identity differs")
                  require(isinstance(name, str), "invalid job name")
                  identities.add(identity)
                  previous = indexed.get(name)
                  require(previous is None or previous["run_attempt"] != attempt,
                          "duplicate job name in one attempt")
                  if previous is None or attempt > previous["run_attempt"]:
                      indexed[name] = job
              return list(indexed.values())


          # source: .github/workflows/claude-review.yml, `name: PR Review`.
          REVIEW_WORKFLOW_NAME = "PR Review"


          def _pipeline_of_review(review, repository, api):
              """The successful Pipeline run of the head a completed review ran on.

              The review and the Pipeline finish in either order (ADR-1127). When the
              review ends last, its completion wakes the resolver, which then needs the
              Pipeline run of the same head: the newest one that succeeded. Without one
              the merge is held, and the Pipeline's own completion will wake the resolver.
              """
              require(
                  review.get("path") == ".github/workflows/claude-review.yml"
                  and review.get("event") == "pull_request"
                  and review.get("status") == "completed"
                  and review.get("conclusion") == "success",
                  "source review did not complete successfully",
              )
              require(
                  review.get("head_repository", {}).get("full_name") == repository,
                  "source head repository differs",
              )
              head = full_sha(review.get("head_sha"))
              path = f"/repos/{repository}/actions/workflows/pipeline.yml/runs"
              runs = [
                  run
                  for run in api.records(
                      f"{path}?head_sha={head}&event=pull_request&status=success",
                      "workflow_runs",
                  )
                  if run.get("head_sha") == head and type(run.get("id")) is int
              ]
              require(runs, "merge held: Pipeline has not succeeded on this head")
              return max(runs, key=lambda run: run["id"])


          def _source_run(event, repository, api):
              require(
                  re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository),
                  "invalid repository",
              )
              require(
                  event.get("repository", {}).get("full_name") == repository,
                  "event repository differs",
              )
              source = event.get("workflow_run")
              require(isinstance(source, dict), "missing workflow_run")
              prefix = f"/repos/{repository}"
              woken_by_review = source.get("name") == REVIEW_WORKFLOW_NAME
              if woken_by_review:
                  source = _pipeline_of_review(source, repository, api)
              _validate_run(source, repository)
              run = api.request("GET", f"{prefix}/actions/runs/{source['id']}")
              _validate_run(run, repository)
              require(
                  run["id"] == source["id"] and run["head_sha"] == source["head_sha"],
                  "source run identity changed",
              )
              require(
                  run.get("run_attempt") == source.get("run_attempt"),
                  "source run has a newer attempt",
              )
              run["woken_by_review"] = woken_by_review
              jobs = _effective_jobs(
                  api.records(f"{prefix}/actions/runs/{run['id']}/jobs?filter=all", "jobs"), run
              )
              run["reduced_matrix"] = _validate_jobs(jobs)
              return run


          def _pull_request(run, repository, api):
              prefix = f"/repos/{repository}"
              # PR association can be empty; accept only one exact same-repository head.
              associations = run.get("pull_requests") or []
              if not associations:
                  associations = [
                      pr
                      for pr in api.records(f"{prefix}/commits/{run['head_sha']}/pulls")
                      if pr.get("head", {}).get("sha") == run["head_sha"]
                      and pr.get("head", {}).get("repo", {}).get("full_name") == repository
                      and pr.get("base", {}).get("ref") == "main"
                      and pr.get("base", {}).get("repo", {}).get("full_name") == repository
                  ]
              require(len(associations) == 1, "source run must identify exactly one PR")
              number = associations[0].get("number")
              require(type(number) is int and number > 0, "invalid PR number")
              pr = api.request("GET", f"{prefix}/pulls/{number}")
              _pr_identity(pr, repository, run["head_sha"])
              return number, pr


          def _push_covers_commit(push, sha):
              if not (
                  push.get("event") == "push"
                  and push.get("head_sha") == sha
                  and push.get("path") == ".github/workflows/pipeline.yml"
                  and push.get("head_branch") == "main"
              ):
                  return False
              return push.get("status") in (
                  "queued",
                  "in_progress",
                  "waiting",
                  "pending",
                  "requested",
              ) or (
                  push.get("status") == "completed"
                  and push.get("conclusion") in ("success", "failure")
              )


          def _has_push_pipeline(repository, sha, api):
              # Human merges normally have a push run already. Observe once; a
              # not-yet-visible push can cause duplicate tests, never skipped tests.
              pushes = api.records(
                  f"/repos/{repository}/actions/workflows/pipeline.yml/runs?event=push&head_sha={sha}",
                  "workflow_runs",
              )
              return any(_push_covers_commit(push, sha) for push in pushes)


          def _ran_the_review(run, prefix, api):
              """True when this run's `Claude review` job executed the `PR Review` step."""
              jobs = api.records(f"{prefix}/actions/runs/{run['id']}/jobs", "jobs")
              return any(
                  job.get("name") == "Claude review"
                  and any(
                      step.get("name") == "PR Review" and step.get("conclusion") == "success"
                      for step in job.get("steps") or []
                  )
                  for job in jobs
              )


          def _review_approves(number, head, repository, api):
              """The Claude review of this exact head decides the merge (ADR-1121).

              A verdict counts only when its comment links the run id of a claude-review.yml
              run of this head whose `PR Review` step succeeded. A review of an older head
              links another run, and a run that skipped the review (past the cap) has no
              such step, so neither can approve a newer head. The latest verdict wins.
              """
              prefix = f"/repos/{repository}"
              runs = [
                  run
                  for run in api.records(
                      f"{prefix}/actions/workflows/claude-review.yml/runs?head_sha={head}",
                      "workflow_runs",
                  )
                  if run.get("head_sha") == head and run.get("conclusion") == "success"
              ]
              reviewed = [run for run in runs if _ran_the_review(run, prefix, api)]
              require(reviewed, "merge held: no Claude review ran on this head")
              links = [f"/actions/runs/{run['id']}" for run in reviewed]
              verdicts = []
              for comment in api.records(f"{prefix}/issues/{number}/comments"):
                  user = comment.get("user") or {}
                  body = comment.get("body") or ""
                  if user.get("login") != "claude[bot]" or user.get("type") != "Bot":
                      continue
                  if not any(re.search(re.escape(link) + r"(?!\d)", body) for link in links):
                      continue
                  found = re.findall(r"^Verdict: (approve|block)\s*$", body, re.M)
                  if found:
                      verdicts.append((comment["updated_at"], found[-1]))
              require(verdicts, "merge held: Claude has not posted a verdict on this head")
              require(max(verdicts)[1] == "approve", "merge held: Claude review verdict is block")


          # The ci.json key that names the files a low-risk dependency update may touch
          # (ADR-1126): the manifests and locks of the ecosystems the repository
          # declares in .github/dependabot.yml. The names differ per repository, so
          # they live in ci.json and not in this file (ADR-1131).
          # source: the contract step's validator below, LOW_RISK_KEY.
          LOW_RISK_KEY = "low_risk_files"
          # source: the `update-type` values Dependabot writes in its commit message,
          # https://github.com/dependabot/fetch-metadata#outputs
          LOW_RISK_UPDATES = frozenset(
              {"version-update:semver-minor", "version-update:semver-patch"}
          )


          def _low_risk_files(repository, api):
              """The file names ci.json lists under `low_risk_files`, or a failure.

              Read from the default branch, which no pull request can change before it
              is merged. A missing file, a missing key or a malformed list fails the
              resolver: no built-in list stands in for it.
              source: https://docs.github.com/en/rest/repos/contents#get-repository-content
              (no `ref`: the default branch; a file's content is base64).
              """
              document = api.request("GET", f"/repos/{repository}/contents/ci.json")
              require(
                  isinstance(document, dict) and document.get("encoding") == "base64",
                  "ci.json: not a file on the default branch",
              )
              try:
                  data = json.loads(base64.b64decode(document.get("content") or ""))
              except ValueError as exc:
                  raise PostMergeError("ci.json: not valid JSON") from exc
              require(
                  isinstance(data, dict) and LOW_RISK_KEY in data,
                  f"ci.json: {LOW_RISK_KEY}: missing",
              )
              names = data[LOW_RISK_KEY]
              require(
                  isinstance(names, list)
                  and all(isinstance(name, str) and name and "/" not in name for name in names),
                  f"ci.json: {LOW_RISK_KEY}: must be a list of file names",
              )
              return frozenset(names)


          def _declared_updates(commit):
              """Update types of one Dependabot commit, or None when it is not one.

              A git author is only a declared e-mail, and `verified` vouches for the
              committer's key. Dependabot's commits are committed and signed by GitHub
              itself (`web-flow`), where the author is the acting account and cannot be
              chosen. Every dependency the commit names must declare its update type.
              source: https://docs.github.com/en/authentication/managing-commit-signature-verification/about-commit-signature-verification
              """
              detail = commit.get("commit") or {}
              signed = (detail.get("verification") or {}).get("verified") is True
              author = (commit.get("author") or {}).get("login")
              committer = (commit.get("committer") or {}).get("login")
              if author != "dependabot[bot]" or committer != "web-flow" or not signed:
                  return None
              message = detail.get("message") or ""
              updates = re.findall(r"^\s*update-type: (\S+)\s*$", message, re.M)
              names = re.findall(r"^\s*- dependency-name: ", message, re.M)
              return updates if updates and len(updates) == len(names) else None


          def _is_low_risk(pr, repository, api):
              """True for a Dependabot minor or patch update of the dependency files.

              The tier comes from the change, not from a label or a title (ADR-1126): the
              PR is Dependabot's single commit (committed and signed by GitHub), every
              update it declares is minor or patch, and every file it touches is named
              in ci.json's `low_risk_files` and lies outside `.github/`. Such a PR merges
              on green required checks without a review.
              """
              user = pr.get("user") or {}
              if user.get("login") != "dependabot[bot]" or user.get("type") != "Bot":
                  return False
              allowed = _low_risk_files(repository, api)
              path = f"/repos/{repository}/pulls/{pr['number']}"
              commits = list(api.records(path + "/commits"))
              # Dependabot opens and rebases a PR as one commit; a second one is
              # someone else's work on its branch.
              if len(commits) != 1:
                  return False
              updates = _declared_updates(commits[0])
              if updates is None or not set(updates) <= LOW_RISK_UPDATES:
                  return False
              files = set()
              for row in api.records(path + "/files"):
                  # A rename counts under both of its names.
                  files |= {row.get("filename"), row.get("previous_filename")} - {None}
              # A workflow or action directory never holds a dependency manifest.
              if any(name.startswith(".github/") for name in files):
                  return False
              # By file name: a workspace carries one manifest per package.
              names = {name.rsplit("/", 1)[-1] for name in files}
              return bool(files) and names <= allowed


          # The ci.json key that names the documentation paths (ADR-1133).
          # source: the contract step's validator below, DOCS_KEY.
          DOCS_KEY = "docs_paths"
          # source: https://docs.github.com/en/rest/pulls/pulls#list-pull-requests-files
          FILES_LISTED_AT_MOST = 3000

          def documentation_only(paths, docs):
              """True when ``paths`` is not empty and each lies under an entry of ``docs``
              (an entry ending in "/" is a directory, any other names one file) and has a
              name Windows can hold: one it cannot would fail only there, after the merge.
              source: https://learn.microsoft.com/en-us/windows/win32/fileio/naming-a-file"""
              devices = {"CON", "PRN", "AUX", "NUL"}
              devices |= {f"{port}{digit}" for port in ("COM", "LPT") for digit in "123456789"}

              def portable(part):
                  return (
                      part == part.rstrip(" .")
                      and not any(char in '<>:"|?*\\' or ord(char) < 32 for char in part)
                      and part.split(".")[0].upper() not in devices
                  )

              return bool(paths) and all(
                  all(portable(part) for part in path.split("/"))
                  and any(path.startswith(entry) if entry.endswith("/") else path == entry for entry in docs)
                  for path in paths
              )


          def _docs_paths(repository, api):
              """The paths ci.json lists under `docs_paths` on the default branch, which no
              pull request can change before it is merged. A missing key is an empty
              list: no pull request is documentation only."""
              document = api.request("GET", f"/repos/{repository}/contents/ci.json")
              require(
                  isinstance(document, dict) and document.get("encoding") == "base64",
                  "ci.json: not a file on the default branch",
              )
              try:
                  data = json.loads(base64.b64decode(document.get("content") or ""))
              except ValueError as exc:
                  raise PostMergeError("ci.json: not valid JSON") from exc
              paths = data.get(DOCS_KEY, []) if isinstance(data, dict) else None
              require(
                  isinstance(paths, list)
                  and all(
                      isinstance(path, str)
                      and path
                      and path != "ci.json"
                      and not path.startswith(("/", "."))
                      and ".." not in path.split("/")
                      for path in paths
                  ),
                  f"ci.json: {DOCS_KEY}: must be a list of paths inside the repository",
              )
              return paths


          def _documentation_only(pr, repository, api):
              """True when every path the pull request touches lies under ci.json's
              `docs_paths` (ADR-1133). A rename counts under both of its names."""
              paths = []
              for row in api.records(f"/repos/{repository}/pulls/{pr['number']}/files"):
                  names = [row.get("filename"), row.get("previous_filename")]
                  if not names[0] or not all(isinstance(name, (str, type(None))) for name in names):
                      return False
                  paths += [name for name in names if name]
              return len(paths) < FILES_LISTED_AT_MOST and documentation_only(
                  paths, _docs_paths(repository, api)
              )


          def _merge_open_pr(pr, merge_path, head, api, repository):
              require(
                  pr.get("state") == "open" and pr.get("draft") is False,
                  "PR is closed or draft",
              )
              require("do not merge" not in pr.get("title", "").lower(), "PR title holds merge")
              require(
                  not any(
                      label.get("name", "").lower() in ("hold", "do-not-merge")
                      for label in pr.get("labels", [])
                  ),
                  "PR label holds merge",
              )
              if _is_low_risk(pr, repository, api):
                  print("post-merge: low-risk dependency update, no review required")
              else:
                  _review_approves(pr["number"], head, repository, api)
              result = api.request(
                  "PUT",
                  merge_path,
                  {"sha": head, "merge_method": "squash"},
              )
              require(result.get("merged") is True, "GitHub did not confirm a completed merge")
              return full_sha(result.get("sha"))


          def _confirm_pr_merge(pr_path, original_pr, sha, api):
              # REST merge constrains only head SHA, not base ref. Re-read after PUT:
              # the PR must report this exact merge commit and the head that was tested.
              # https://docs.github.com/en/rest/pulls/pulls#merge-a-pull-request
              repository = original_pr["base"]["repo"]["full_name"]
              pr = api.request("GET", pr_path)
              _pr_identity(pr, repository, original_pr["head"]["sha"])
              require(
                  pr.get("merged") is True and pr.get("merge_commit_sha") == sha,
                  "PR does not confirm the returned merge commit",
              )


          def resolve(event, repository: str, api: GitHub):
              run = _source_run(event, repository, api)
              number, pr = _pull_request(run, repository, api)
              if run.get("reduced_matrix"):
                  require(
                      _documentation_only(pr, repository, api),
                      "source merge gate requires the three systems: "
                      "the pull request is not documentation only",
                  )
              pr_path = f"/repos/{repository}/pulls/{number}"
              already_merged = pr.get("merged") is True
              if already_merged:
                  sha = full_sha(pr.get("merge_commit_sha"))
              else:
                  sha = _merge_open_pr(pr, pr_path + "/merge", run["head_sha"], api, repository)
              _confirm_pr_merge(pr_path, pr, sha, api)
              if already_merged and _has_push_pipeline(repository, sha, api):
                  return {
                      "tested_sha": sha,
                      "run_tests": "false",
                      "pr_number": str(number),
                      "reason": "An exact-SHA main push Pipeline already exists",
                  }
              if already_merged and run.get("woken_by_review"):
                  # The Pipeline's completion merged this PR and tests the merge commit.
                  return {
                      "tested_sha": sha,
                      "run_tests": "false",
                      "pr_number": str(number),
                      "reason": "Already merged when the review completed",
                  }
              return {
                  "tested_sha": sha,
                  "run_tests": "true",
                  "pr_number": str(number),
                  "reason": "Test the confirmed protected merge commit",
              }


          # A merge that waits is not a failure of main: the review or the Pipeline of
          # this head is not there yet, or a newer head has its own run. The run that
          # brings the missing part wakes the resolver again (ADR-1127), so these end
          # green with a notice instead of a red run on the default branch (ADR-1128).
          WAITING = ("merge held:", "PR head advanced after testing")


          def main():
              try:
                  require(
                      os.environ.get("GITHUB_EVENT_NAME") == "workflow_run",
                      "resolver requires workflow_run",
                  )
                  event = json.loads(
                      Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")
                  )
                  result = resolve(
                      event,
                      os.environ["GITHUB_REPOSITORY"],
                      GitHub(os.environ.get("GH_TOKEN", "")),
                  )
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      for key, value in result.items():
                          output.write(f"{key}={value}\n")
                  print(
                      f"PR #{result['pr_number']}: {result['reason']}; SHA {result['tested_sha']}"
                  )
                  return 0
              except PostMergeError as exc:
                  if str(exc).startswith(WAITING):
                      # No output is written: no downstream job runs, the run is green.
                      print(f"::notice title=Merge not made::{exc}")
                      return 0
                  print(f"post-merge: {exc}", file=sys.stderr)
                  return 1
              except (
                  OSError,
                  ValueError,
                  KeyError,
                  TypeError,
                  AttributeError,
              ) as exc:
                  print(f"post-merge: {exc}", file=sys.stderr)
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          PY

  # GitHub does not close the issues a PR names with a closing keyword when the
  # merge is made with the workflow's GITHUB_TOKEN (the resolver's PUT): the 8 such
  # merges before 2026-11-06 all left their issues open (#801 after #908). This
  # job closes what GitHub itself links to the PR (closingIssuesReferences). It is
  # outside the test chain: a failure here shows red without blocking the tests.
  close-issues:
    needs: resolve
    if: >-
      !cancelled() && github.event_name == 'workflow_run'
      && needs.resolve.result == 'success'
      && needs.resolve.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5 # source: operational cap; a few API calls per merged PR.
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Close the issues the merged PR closes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: |
          python3 - <<'CLOSE'
          """Close the open issues GitHub links to a PR the resolver merged.

          Sources:
          https://docs.github.com/en/graphql/reference/objects#pullrequest (closingIssuesReferences)
          https://docs.github.com/en/rest/issues/issues#update-an-issue (state_reason)
          https://docs.github.com/en/rest/issues/comments#create-an-issue-comment
          """

          import json
          import os
          import sys
          from urllib.request import Request, urlopen

          API = "https://api.github.com"
          # source: the GraphQL login of the GITHUB_TOKEN actor that the resolver merges as.
          RESOLVER = "github-actions"
          QUERY = """
          query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                merged
                mergedBy { login }
                closingIssuesReferences(first: 50) {
                  pageInfo { hasNextPage }
                  nodes { number state repository { nameWithOwner } }
                }
              }
            }
          }
          """


          def call(method, url, payload=None):
              request = Request(
                  url,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read() or b"null")


          def main():
              repository = os.environ["GITHUB_REPOSITORY"]
              owner, name = repository.split("/")
              number = int(os.environ["PR_NUMBER"])
              data = call(
                  "POST",
                  f"{API}/graphql",
                  {"query": QUERY, "variables": {"owner": owner, "name": name, "number": number}},
              )
              if data.get("errors"):
                  raise SystemExit(f"close-issues: GraphQL errors: {data['errors']}")
              pull = data["data"]["repository"]["pullRequest"]
              if pull["merged"] is not True:
                  raise SystemExit(f"close-issues: PR #{number} is not merged")
              merger = (pull.get("mergedBy") or {}).get("login")
              if merger != RESOLVER:
                  # GitHub closes the issues itself when a person merges.
                  print(f"PR #{number} merged by {merger}: GitHub closes its issues")
                  return 0
              links = pull["closingIssuesReferences"]
              if links["pageInfo"]["hasNextPage"]:
                  raise SystemExit(f"close-issues: PR #{number} links over 50 issues")
              for issue in links["nodes"]:
                  owner_repo = issue["repository"]["nameWithOwner"]
                  if owner_repo != repository:
                      print(f"{owner_repo}#{issue['number']}: another repository, left alone")
                      continue
                  if issue["state"] != "OPEN":
                      print(f"#{issue['number']} already {issue['state'].lower()}")
                      continue
                  path = f"{API}/repos/{repository}/issues/{issue['number']}"
                  # Close first: a failed close must not leave a "Closed by" comment.
                  call("PATCH", path, {"state": "closed", "state_reason": "completed"})
                  body = f"Closed by #{number}, merged by the resolver (its GITHUB_TOKEN merge does not trigger GitHub's closing keywords)."
                  call("POST", f"{path}/comments", {"body": body})
                  print(f"#{issue['number']} closed by #{number}")
              if not links["nodes"]:
                  print(f"PR #{number} names no issue to close")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          CLOSE

  # ci.json first: a missing key or an empty command fails here, before any
  # test runs (design, "Repository contract: ci.json"). The validator began as
  # tools/ci_contract.py of zetetic-team-subagents; `low_risk_files` was added
  # here (ADR-1131).
  contract:
    needs: resolve
    if: >-
      !cancelled() && github.event_name == 'workflow_run'
      && needs.resolve.result == 'success' && needs.resolve.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    outputs:
      tested_sha: ${{ steps.source.outputs.tested_sha }}
      unit: ${{ steps.commands.outputs.unit }}
      regression: ${{ steps.commands.outputs.regression }}
      e2e: ${{ steps.commands.outputs.e2e }}
      environment: ${{ steps.commands.outputs.environment }}
      install: ${{ steps.commands.outputs.install }}
      release_tags: ${{ steps.commands.outputs.release_tags }}
      release_group: ${{ steps.commands.outputs.release_group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tested_sha }}
      - name: Record tested commit
        id: source
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "tested_sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Guard - no comparison against main (owner rule 2026-10-29)
        run: python3 -m unittest discover -s scripts/tests -p test_no_main_comparison.py -v

      - name: Validate ci.json
        id: commands
        run: |
          python3 - "$GITHUB_WORKSPACE" --github-output <<'PY'
          #!/usr/bin/env python3
          """ci_contract.py -- validates a repository's ``ci.json`` before any test runs.

          The contract (docs/superpowers/specs/2026-10-22-single-ci-design.md, "Repository
          contract: ci.json"): exactly the keys ``unit``, ``regression``, ``e2e``,
          ``environment`` and ``install``, each a non-empty shell command, plus an
          optional ``version_file`` (default ``.claude-plugin/plugin.json``), or exclusive
          ``release_packages`` entries with version_file and tag_prefix, plus the
          required ``low_risk_files``: the file names (no directory) a low-risk
          dependency update may touch, read by the merge resolver, and the optional
          ``docs_paths``: the directories (ending in ``/``) and the files whose change
          alone lets a pull request run ``environment`` and ``install`` on Linux only
          (ADR-1133). Every manifest version and tag ref is validated before exporting
          commands or release tags.
          A missing file, a missing key or an empty command fails the pipeline here, so a step that
          has nothing to run never passes (the design's first anti-goal).

          This file is also embedded verbatim in ``templates/ci/pipeline.yml`` as an inline
          ``python3 -`` step: standard library only, arguments through ``sys.argv``.

          Usage: ``python3 tools/ci_contract.py [repo-root]`` (default: the current
          directory). Exit 0 and the five commands plus ``version_file`` on stdout when
          valid; exit 1 and the faults on stderr otherwise. --github-output exports the
          validated commands and tags to GITHUB_OUTPUT. Source: tasks/package-release-tags.md.
          """

          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          import sys
          import uuid
          from pathlib import Path
          from typing import List

          KEYS = ("unit", "regression", "e2e", "environment", "install")
          VERSION_KEY = "version_file"
          DEFAULT_VERSION_FILE = ".claude-plugin/plugin.json"
          RELEASE_KEY = "release_packages"
          LOW_RISK_KEY = "low_risk_files"
          DOCS_KEY = "docs_paths"
          ALLOWED_KEYS = KEYS + (VERSION_KEY, RELEASE_KEY, LOW_RISK_KEY, DOCS_KEY)
          ALLOWED = ", ".join(ALLOWED_KEYS)


          def _load(root: Path):
              """The parsed document, or the one fault that stops validation."""
              path = root / "ci.json"
              if not path.is_file():
                  return None, "ci.json: missing"
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (ValueError, UnicodeDecodeError) as exc:
                  return None, f"ci.json: not valid JSON ({exc})"
              if not isinstance(data, dict):
                  return None, "ci.json: must be a JSON object"
              return data, None


          def _release_specs(data: dict) -> list[dict]:
              """Explicit package identities, or the historical single v<version> tag."""
              if RELEASE_KEY not in data:
                  return [
                      {
                          "version_file": data.get(VERSION_KEY, DEFAULT_VERSION_FILE),
                          "tag_prefix": "v",
                      }
                  ]
              if VERSION_KEY in data:
                  raise ValueError("release_packages: cannot be combined with version_file")
              specs = data[RELEASE_KEY]
              if not isinstance(specs, list) or not specs:
                  raise ValueError("release_packages: must be a nonempty list")
              for spec in specs:
                  if not isinstance(spec, dict) or set(spec) != {"version_file", "tag_prefix"}:
                      raise ValueError(
                          "release_packages: entries need version_file and tag_prefix only"
                      )
              return specs


          def _manifest_path(root: Path, value: str) -> Path:
              if not isinstance(value, str):
                  raise ValueError("version_file: not a string")
              if not value.strip():
                  raise ValueError("version_file: empty path")
              relative = Path(value)
              path = (root / relative).resolve()
              if (
                  relative.is_absolute()
                  or ".." in relative.parts
                  or not path.is_relative_to(root.resolve())
              ):
                  raise ValueError("version_file: must stay inside the repository")
              if not path.is_file():
                  raise ValueError(f"version_file: {value} does not exist")
              return path


          def _manifest_version(path: Path) -> str:
              body = path.read_text(encoding="utf-8")
              if path.suffix == ".json":
                  doc = json.loads(body)
                  # Existing bundle contract: session-optimizer/tools/build-release-bundle.sh
                  # at 9145994e221d13693bb4a243a2a810c466fa077a reads metadata.version.
                  if isinstance(doc, dict) and "version" not in doc:
                      doc = doc.get("metadata")
              elif path.suffix == ".toml":
                  # Stdlib parser added in 3.11: https://docs.python.org/3/library/tomllib.html.
                  try:
                      import tomllib
                  except ImportError as exc:
                      raise ValueError(
                          "version_file: TOML requires Python 3.11+ (stdlib tomllib)"
                      ) from exc
                  doc = tomllib.loads(body)
                  doc = doc.get("project") or doc.get("package")
              else:
                  raise ValueError(f"version_file: unsupported format: {path.name}")
              version = doc.get("version") if isinstance(doc, dict) else None
              if not isinstance(version, str) or not version or version != version.strip():
                  raise ValueError(f"version_file: {path.name} needs a nonempty string version")
              return version


          def _valid_tag(tag: str) -> bool:
              # Delegate ref grammar to Git: https://git-scm.com/docs/git-check-ref-format.
              return (
                  subprocess.run(
                      ["git", "check-ref-format", f"refs/tags/{tag}"], capture_output=True
                  ).returncode
                  == 0
              )


          def release_tags(data: dict, root: Path) -> list[str]:
              """Resolve and validate the whole release plan without filesystem writes."""
              tags, paths, prefixes = [], set(), set()
              for spec in _release_specs(data):
                  path = _manifest_path(root, spec["version_file"])
                  prefix = spec["tag_prefix"]
                  if not isinstance(prefix, str) or not prefix or not _valid_tag(prefix + "0"):
                      raise ValueError("tag_prefix: invalid Git tag prefix")
                  if path in paths or prefix in prefixes:
                      raise ValueError("release_packages: duplicate manifest or tag prefix")
                  version = _manifest_version(path)
                  tag = prefix + version
                  if not _valid_tag(tag):
                      raise ValueError(f"version_file: invalid Git tag: {tag!r}")
                  if any(
                      tag == prior or tag.startswith(prior + "/") or prior.startswith(tag + "/")
                      for prior in tags
                  ):
                      raise ValueError("release_packages: duplicate or conflicting tag refs")
                  tags.append(tag)
                  paths.add(path)
                  prefixes.add(prefix)
              return tags


          def _version_faults(data: dict, root: Path) -> List[str]:
              try:
                  release_tags(data, root)
              except (ValueError, OSError, UnicodeError, RuntimeError) as exc:
                  return [str(exc)]
              return []


          def _low_risk_faults(data: dict) -> List[str]:
              """An empty list is valid: no dependency update skips the review."""
              if LOW_RISK_KEY not in data:
                  return [f"{LOW_RISK_KEY}: missing"]
              names = data[LOW_RISK_KEY]
              if not isinstance(names, list) or not all(
                  isinstance(name, str) and name and "/" not in name for name in names
              ):
                  return [f"{LOW_RISK_KEY}: must be a list of file names"]
              return []


          def _docs_paths_faults(data: dict) -> List[str]:
              """Optional. Each entry is a directory ending in "/" or one file, inside the
              repository and outside its dot-directories; ci.json is never one."""
              paths = data.get(DOCS_KEY, [])
              if not isinstance(paths, list) or not all(
                  isinstance(path, str)
                  and path
                  and path == path.strip()
                  and path != "ci.json"
                  and not path.startswith(("/", "."))
                  and ".." not in path.split("/")
                  for path in paths
              ):
                  return [f"{DOCS_KEY}: must be a list of paths inside the repository"]
              return []


          def faults(root: Path) -> List[str]:
              """Every fault of ``root/ci.json``, in key order then unknown keys; empty
              when the file honours the contract."""
              data, fatal = _load(root)
              if fatal:
                  return [fatal]
              found: List[str] = []
              for key in KEYS:
                  if key not in data:
                      found.append(f"{key}: missing")
                  elif not isinstance(data[key], str):
                      found.append(f"{key}: not a string")
                  elif not data[key].strip():
                      found.append(f"{key}: empty command")
              found.extend(
                  f"{key}: unknown key (allowed: {ALLOWED})"
                  for key in data
                  if key not in ALLOWED_KEYS
              )
              found.extend(_low_risk_faults(data))
              found.extend(_docs_paths_faults(data))
              found.extend(_version_faults(data, root))
              return found


          def _export(data: dict, tags: list[str]) -> None:
              outputs = {key: data[key] for key in KEYS}
              outputs["release_tags"] = json.dumps(tags)
              outputs["release_group"] = hashlib.sha256(
                  json.dumps(sorted(tags)).encode()
              ).hexdigest()
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  for key, value in outputs.items():
                      # GitHub multiline output protocol: delimiter cannot occur on its own line.
                      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
                      delimiter = str(uuid.uuid4())
                      while delimiter in value.splitlines():
                          delimiter = str(uuid.uuid4())
                      out.write(f"{key}<<{delimiter}\n{value}\n{delimiter}\n")


          def main(argv: List[str]) -> int:
              root = Path(argv[0]) if argv else Path(".")
              found = faults(root)
              if found:
                  for line in found:
                      print(line, file=sys.stderr)
                  return 1
              data, _ = _load(root)
              for key in KEYS:
                  print(f"{key}: {data[key]}")
              if RELEASE_KEY in data:
                  print(f"{RELEASE_KEY}: {json.dumps(data[RELEASE_KEY])}")
              else:
                  print(f"{VERSION_KEY}: {data.get(VERSION_KEY, DEFAULT_VERSION_FILE)}")
              if "--github-output" in argv:
                  _export(data, release_tags(data, root))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY

  # The unit command must leave a Cobertura coverage.xml; the reader is
  # tools/ci_coverage.py of zetetic-team-subagents, embedded byte for byte,
  # and fails the step under 90 % of lines (design, Constraints).
  unit:
    needs: contract
    if: >-
      !cancelled()
      && needs.contract.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.tested_sha }}

      - name: Restore Cargo build cache
        id: cargo_cache
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-

      - name: Run the unit command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.unit }}
        run: bash -eo pipefail -c "$CI_COMMAND"

      # Save a successful build even when the independent coverage floor fails.
      # https://github.com/actions/cache/blob/55cc8345863c7cc4c66a329aec7e433d2d1c52a9/save/README.md
      - name: Save Cargo build cache
        if: success() && hashFiles('Cargo.lock') != '' && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}

      - name: Enforce the coverage floor
        run: |
          python3 - coverage.xml --min 90 <<'PY'
          #!/usr/bin/env python3
          """ci_coverage.py -- reads a Cobertura report and fails under a line threshold.

          The single CI (docs/superpowers/specs/2026-10-22-single-ci-design.md,
          "Repository contract: ci.json") makes the ``unit`` step produce Cobertura XML
          at ``coverage.xml`` and fails it under 90 % of lines, the same number for the
          eight repositories. The root element's ``line-rate`` (0 to 1) is the figure
          every producer here writes (coverage.py, cargo-llvm-cov, vitest/istanbul), so
          one reader serves all stacks. Decimal arithmetic keeps 0.899 at 89.90, not at
          a binary neighbour of the threshold.

          This file is also embedded verbatim in ``templates/ci/pipeline.yml`` as an inline
          ``python3 -`` step: standard library only, arguments through ``sys.argv``.

          Usage: ``python3 tools/ci_coverage.py coverage.xml [--min 90]``. Exit 0 at or
          above the minimum, 1 under it, 2 when the report is absent or unreadable (an
          unmeasurable coverage is not a pass).
          """
          from __future__ import annotations

          import argparse
          import sys
          import xml.etree.ElementTree as ET
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          from typing import List

          # source: docs/superpowers/specs/2026-10-22-single-ci-design.md, Constraints
          # ("Coverage threshold: 90 % of lines ... same number for the eight repositories").
          DEFAULT_MIN = Decimal("90")
          # xml.etree stays, not defusedxml: the step must run on a bare runner with the
          # standard library, and the report is written by the repository's own unit
          # command in the same job. ElementTree does not expand external entities
          # (https://docs.python.org/3/library/xml.html#xml-vulnerabilities, "Safe").


          class CoverageError(Exception):
              """The report cannot be read as a Cobertura document with a line-rate."""


          def percent(path: Path) -> Decimal:
              """Line coverage of ``path`` as a percentage with two decimals."""
              if not path.is_file():
                  raise CoverageError(f"{path}: no such file")
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  raise CoverageError(f"{path}: not well-formed XML ({exc})") from exc
              if root.tag != "coverage":
                  raise CoverageError(f"{path}: root element is <{root.tag}>, not <coverage>")
              raw = root.get("line-rate")
              if raw is None:
                  raise CoverageError(f"{path}: <coverage> has no line-rate attribute")
              try:
                  rate = Decimal(raw)
              except InvalidOperation as exc:
                  raise CoverageError(f"{path}: line-rate {raw!r} is not a number") from exc
              return (rate * 100).quantize(Decimal("0.01"))


          def main(argv: List[str]) -> int:
              parser = argparse.ArgumentParser(description="fail when Cobertura line coverage is under a minimum")
              parser.add_argument("report", type=Path, help="Cobertura XML report")
              parser.add_argument("--min", type=Decimal, default=DEFAULT_MIN, help="minimum percentage of lines (default 90)")
              args = parser.parse_args(argv)
              try:
                  value = percent(args.report)
              except CoverageError as exc:
                  print(exc, file=sys.stderr)
                  return 2
              minimum = args.min.quantize(Decimal("0.01"))
              if value < minimum:
                  print(f"coverage: {value}% of lines, under the minimum {minimum}%")
                  return 1
              print(f"coverage: {value}% of lines, minimum {minimum}%")
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY

  regression:
    needs: [contract, unit]
    if: >-
      !cancelled()
      && needs.contract.result == 'success'
      && needs.unit.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.tested_sha }}

      - name: Cache Cargo build
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-

      - name: Run the regression command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.regression }}
        run: bash -eo pipefail -c "$CI_COMMAND"

  e2e:
    needs: [contract, regression]
    if: >-
      !cancelled()
      && needs.contract.result == 'success'
      && needs.regression.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.tested_sha }}

      - name: Cache Cargo build
        if: hashFiles('Cargo.lock') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('rust-toolchain', 'rust-toolchain.toml', '.cargo/config', '.cargo/config.toml', 'ci.json') }}-

      - name: Run the e2e command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.e2e }}
        run: bash -eo pipefail -c "$CI_COMMAND"

  # A bare runner (decision 6): the runner image plus the pinned CLI, nothing
  # else installed by the pipeline. CI_OS and CI_WORK are the contract's
  # two variables for the environment and install commands.
  environment:
    needs: [contract, e2e]
    if: >-
      !cancelled()
      && needs.contract.result == 'success'
      && needs.e2e.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.tested_sha }}

      - name: Install the Claude Code CLI
        # source: https://docs.npmjs.com/cli/v11/commands/npm-ci
        run: |
          npm ci --prefix "$GITHUB_WORKSPACE/.github/claude-cli"
          echo "$GITHUB_WORKSPACE/.github/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Scratch directory and OS name
        run: |
          work="$(mktemp -d)"
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -m "$work")"; fi
          case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=macos ;; *) os=windows ;; esac
          { echo "CI_WORK=$work"; echo "CI_OS=$os"; } >> "$GITHUB_ENV"

      - name: Run the environment command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.environment }}
        run: bash -eo pipefail -c "$CI_COMMAND"

  # Fresh HOME and CLAUDE_CONFIG_DIR under the scratch directory: the install
  # command sees a machine that has never run Claude Code.
  install:
    needs: [contract, environment]
    if: >-
      !cancelled()
      && needs.contract.result == 'success'
      && needs.environment.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.contract.outputs.tested_sha }}

      - name: Install the Claude Code CLI
        # source: https://docs.npmjs.com/cli/v11/commands/npm-ci
        run: |
          npm ci --prefix "$GITHUB_WORKSPACE/.github/claude-cli"
          echo "$GITHUB_WORKSPACE/.github/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Scratch directory and OS name
        run: |
          work="$(mktemp -d)"
          if [ "$RUNNER_OS" = Windows ]; then work="$(cygpath -m "$work")"; fi
          mkdir -p "$work/home" "$work/claude"
          case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=macos ;; *) os=windows ;; esac
          { echo "CI_WORK=$work"; echo "CI_OS=$os"; } >> "$GITHUB_ENV"

      - name: Run the install command
        env:
          CI_COMMAND: ${{ needs.contract.outputs.install }}
          HOME: ${{ env.CI_WORK }}/home
          USERPROFILE: ${{ env.CI_WORK }}/home
          CLAUDE_CONFIG_DIR: ${{ env.CI_WORK }}/claude
        run: bash -eo pipefail -c "$CI_COMMAND"

  tag:
    # Publish only after all five categories pass on the actual merge commit.
    needs: [contract, unit, regression, e2e, environment, install]
    if: >-
      !cancelled()
      && github.event_name == 'workflow_run'
      && needs.contract.result == 'success'
      && needs.unit.result == 'success'
      && needs.regression.result == 'success'
      && needs.e2e.result == 'success'
      && needs.environment.result == 'success'
      && needs.install.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-tag-${{ needs.contract.outputs.release_group }}
      cancel-in-progress: false
    steps:
      - name: Guard, skip cleanly when RELEASE_TAG_SSH_KEY is missing
        id: guard
        env:
          SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "RELEASE_TAG_SSH_KEY secret not configured, skipping."
            echo "Add the private half of a write-enabled repository deploy"
            echo "key at Settings -> Secrets and variables -> Actions."
            echo "has_deploy_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_deploy_key=true" >> "$GITHUB_OUTPUT"
          fi

      # No working tree of the tested commit is checked out here. This job holds
      # a write-enabled deploy key and runs after a workflow_run event, so a
      # checkout is the CodeQL finding actions/untrusted-checkout (Cortex PR839,
      # ai-architect-mcp-codebase PR471, high). The publish step needs only the
      # commit object and an authenticated origin: a bare repository with the
      # commit fetched by SHA gives both and executes nothing from the commit.
      # GitHub's SSH host keys are read from api.github.com/meta over TLS at run
      # time (source: docs.github.com, "GitHub's SSH key fingerprints"), the
      # same keys actions/checkout installs, without a hard-coded copy to age.
      - name: Fetch the tested commit into a bare repository
        if: steps.guard.outputs.has_deploy_key == 'true'
        env:
          SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
          TESTED_SHA: ${{ needs.contract.outputs.tested_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TESTED_SHA" in
            *[!0-9a-f]* | '') echo "::error::tested_sha is not a lowercase hex SHA"; exit 1 ;;
          esac
          [ "${#TESTED_SHA}" -eq 40 ] || { echo "::error::tested_sha is not 40 hex chars"; exit 1; }
          key_dir="$RUNNER_TEMP/release-key"
          (umask 077 && mkdir -p "$key_dir" && printf '%s\n' "$SSH_KEY" > "$key_dir/id")
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$key_dir/known_hosts"
          [ -s "$key_dir/known_hosts" ] || { echo "::error::api.github.com/meta returned no SSH host keys"; exit 1; }
          ssh_command="ssh -i $key_dir/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$key_dir/known_hosts -o StrictHostKeyChecking=yes"
          echo "GIT_SSH_COMMAND=$ssh_command" >> "$GITHUB_ENV"
          export GIT_SSH_COMMAND="$ssh_command"
          repo="$RUNNER_TEMP/release-repo"
          git init --quiet --bare "$repo"
          git -C "$repo" remote add origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git -C "$repo" fetch --quiet --depth=1 origin "$TESTED_SHA"
          [ "$(git -C "$repo" cat-file -t "$TESTED_SHA")" = commit ] || { echo "::error::fetched object is not a commit"; exit 1; }

      - name: Set up Python
        if: steps.guard.outputs.has_deploy_key == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Publish declared package tags
        id: publish
        if: steps.guard.outputs.has_deploy_key == 'true'
        working-directory: ${{ runner.temp }}/release-repo
        env:
          RELEASE_TAGS: ${{ needs.contract.outputs.release_tags }}
          TESTED_SHA: ${{ needs.contract.outputs.tested_sha }}
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Publish validated package versions without overwriting an existing tag.

          Source: tasks/package-release-tags.md; git-scm.com/docs/git-push (--atomic).
          Concurrent overlap is retried only after the pending set strictly shrinks.
          """

          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path


          def git(*args, check=True):
              return subprocess.run(["git", *args], text=True, capture_output=True, check=check)


          def validate(tags, sha):
              if not isinstance(sha, str) or re.fullmatch(r"[0-9a-f]{40}", sha) is None:
                  raise ValueError("Release target must be a full commit SHA")
              if git("cat-file", "-t", sha).stdout.strip() != "commit":
                  raise ValueError("Release target must name a commit object")
              if (
                  not isinstance(tags, list)
                  or not tags
                  or any(not isinstance(t, str) or not t for t in tags)
              ):
                  raise ValueError("release_tags must be a nonempty list of tag names")
              if len(set(tags)) != len(tags):
                  raise ValueError("duplicate release tags")
              for tag in tags:
                  git("check-ref-format", "refs/tags/" + tag)
                  if any(other != tag and other.startswith(tag + "/") for other in tags):
                      raise ValueError("conflicting release tag refs")


          def remote_existing(tags):
              refs = {"refs/tags/" + tag: tag for tag in tags}
              output = git("ls-remote", "--refs", "origin", *refs).stdout
              return {
                  refs[line.split()[1]]
                  for line in output.splitlines()
                  if len(line.split()) == 2 and line.split()[1] in refs
              }


          def prepare_local(tags, sha):
              for tag in tags:
                  ref = "refs/tags/" + tag
                  found = git("show-ref", "--verify", "--quiet", ref, check=False)
                  if found.returncode == 0:
                      if git("rev-parse", ref + "^{}").stdout.strip() != sha:
                          raise ValueError("Local unpublished tag points elsewhere: " + tag)
                  elif found.returncode == 1:
                      git(
                          "-c",
                          "user.name=github-actions[bot]",
                          "-c",
                          "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                          "tag",
                          "-a",
                          "-m",
                          "Release " + tag,
                          "--",
                          tag,
                          sha,
                      )
                  else:
                      raise subprocess.CalledProcessError(
                          found.returncode, found.args, stderr=found.stderr
                      )


          def publish(tags, sha):
              existing = remote_existing(tags)
              pending = set(tags) - existing
              while pending:
                  prepare_local(sorted(pending), sha)
                  refs = [f"refs/tags/{tag}:refs/tags/{tag}" for tag in sorted(pending)]
                  result = git("push", "--atomic", "origin", *refs, check=False)
                  if result.returncode == 0:
                      return sorted(pending), sorted(existing)
                  remaining = pending - remote_existing(sorted(pending))
                  if not remaining < pending:
                      raise subprocess.CalledProcessError(
                          result.returncode, result.args, stderr=result.stderr
                      )
                  existing.update(pending - remaining)
                  pending = remaining
              return [], sorted(existing)


          def main():
              try:
                  tags = json.loads(os.environ["RELEASE_TAGS"])
                  sha = os.environ["TESTED_SHA"]
                  validate(tags, sha)
                  published, existing = publish(tags, sha)
              except (ValueError, OSError, KeyError, subprocess.CalledProcessError) as exc:
                  print(getattr(exc, "stderr", None) or str(exc), file=sys.stderr)
                  return 1
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
                  for tag in published:
                      out.write(f"Published {tag} at {sha}\n")
                  for tag in existing:
                      out.write(f"Existing {tag}: target preserved\n")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Summarize missing release key
        if: steps.guard.outputs.has_deploy_key != 'true'
        run: echo "## Release gate skipped, RELEASE_TAG_SSH_KEY not configured" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failed release publication
        if: failure() && steps.guard.outputs.has_deploy_key == 'true'
        run: echo "## Release gate failed; no publication success is claimed" >> "$GITHUB_STEP_SUMMARY"
