name: Claude Code

# source: https://github.com/anthropics/claude-code-action/blob/8041f1d17e0e7d2f2cfe35002962e9f26237c0bb/.github/workflows/claude.yml
# Cortex uses its existing OAuth account and owner-authored default-branch events.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: >-
      github.event.sender.login == github.repository_owner
      && ((github.event_name == 'issue_comment'
       && contains(github.event.comment.body, '@claude')
       && github.event.issue.user.login == github.repository_owner
       && github.event.comment.user.login != 'claude[bot]'
       && github.event.comment.user.type != 'Bot')
      || (github.event_name == 'issues'
       && github.event.issue.user.login == github.repository_owner
       && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    # Run one owner request per thread at a time; retain pending requests.
    # source: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
    concurrency:
      group: claude-mentions-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    # One hung agent run must not hold the per-thread queue for the 360-minute
    # default (zetetic-team-subagents #242 review, finding 4).
    # source: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idtimeout-minutes
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # The `if:` above checks who asked, not which branch the pinned action will
      # check out and push to (src/modes/tag/index.ts fetches the PR head). An
      # owner-authored PR whose head is a fork, or main itself, must not become a
      # fix target (zetetic-team-subagents #242 review, finding 1).
      - name: Authorize owner fix target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! is_pull="$(jq -r '.issue.pull_request != null' "$GITHUB_EVENT_PATH")" \
            || { [ "$is_pull" != true ] && [ "$is_pull" != false ]; }; then
            echo "::error::could not read the event at GITHUB_EVENT_PATH; refusing the fix target"
            exit 1
          fi
          if [ "$is_pull" = true ]; then
            if ! pull="$(gh api "repos/$GH_REPO/pulls/$ISSUE_NUMBER")"; then
              echo "::error::could not read PR #$ISSUE_NUMBER; refusing the fix target"
              exit 1
            fi
            if ! jq -e --arg repo "$GH_REPO" \
                '.head.repo.full_name == $repo and .head.ref != .base.repo.default_branch' \
                >/dev/null <<<"$pull"; then
              echo "::error::PR #$ISSUE_NUMBER head is a fork or the default branch; refusing the fix target"
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Use the action App token instead of a persisted workflow token.
          persist-credentials: false
      - name: Install subprocess isolation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap socat
          # source: upstream action.yml subprocess isolation dependency setup.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
      # The allowlisted commands need an installed environment: Python 3.12 and
      # the unit job's dev+sqlite+codebase extras on the SQLite backend (no
      # postgresql: this job has no server, tests_py/conftest.py falls back to
      # SQLite, so PG-only paths are not covered here), plus the lint group for
      # ruff (as memory-exact-review.yml installs it) and the embedding model,
      # which tests_py/infrastructure/test_embedding_live_contract.py requires
      # offline under CI. source: ci.json "unit", .github/actions/test-suite.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the locked dev+sqlite+codebase set and the lint group
        uses: ./.github/actions/uv-locked-install
        with:
          set: --extra dev --extra sqlite --extra codebase --group lint
          environment: ${{ env.pythonLocation }}
      # uv-locked-install passes --no-install-project (ADR-1092). hatchling lives
      # in the packaging group, not in this set, so the project builds in an
      # isolated environment, as .github/actions/test-suite installs it (Codex
      # P1 on #856: --no-build-isolation fails on a fresh setup-python).
      - name: Install the project
        run: pip install --no-deps -e .
      - name: Pre-download embedding model
        run: |
          for attempt in 1 2 3 4 5; do
            python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2', device='cpu')" && exit 0
            echo "HF pre-download attempt ${attempt} failed; retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          # Same offline switches as the pipeline's pytest step: an agent-run
          # pytest must not download models.
          CORTEX_RERANKER_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Upstream action.yml and src/github/data/fetcher.ts at the pinned SHA
          # apply this filter to issue comments, reviews and inline comments.
          include_comments_by_actor: ${{ github.repository_owner }}
          # No --permission-mode: inherit tag mode's workspace edit approval
          # (src/modes/tag/index.ts at the pinned action SHA).
          # Last value wins: upstream base-action/src/parse-sdk-options.ts.
          # Tag mode grants edits and its own scoped git (add, commit, push to the
          # PR branch) only; headless, anything that falls through to "ask" is
          # denied (src/modes/tag/index.ts:158-214). The allowlist adds exactly
          # CLAUDE.md's validation commands (the environment is installed above,
          # so no uv sync: it would build a second .venv and may rewrite uv.lock,
          # tests_py/scripts/test_uv_lock_single_source.py), git inspection and
          # gh run view for the CI logs a fix needs. Tag mode supplies the PR
          # itself and owns the tracking comment, so no gh pr view/diff/comment.
          # A command prefix is not a security boundary (pytest runs repo code by
          # design, git diff and git log take --output): the boundary is the
          # owner gate, the App token, the job permissions and the bubblewrap
          # sandbox. Reviews of #855 and #856.
          claude_args: |
            --strict-mcp-config
            --allowedTools "Bash(pytest:*),Bash(ruff check:*),Bash(ruff format --check:*),Bash(python -m mcp_server.doctor:*),Bash(python scripts/check_craftsmanship.py:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh run view:*)"
            --model "claude-opus-5-5"
