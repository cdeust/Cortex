name: Claude Code

# source: https://github.com/anthropics/claude-code-action/blob/8041f1d17e0e7d2f2cfe35002962e9f26237c0bb/.github/workflows/claude.yml
# Cortex uses its existing OAuth account and owner-authored default-branch events.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: >-
      github.event.sender.login == github.repository_owner
      && ((github.event_name == 'issue_comment'
       && contains(github.event.comment.body, '@claude')
       && github.event.issue.user.login == github.repository_owner
       && github.event.comment.user.login != 'claude[bot]'
       && github.event.comment.user.type != 'Bot')
      || (github.event_name == 'issues'
       && github.event.issue.user.login == github.repository_owner
       && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    # Run one owner request per thread at a time; retain pending requests.
    # source: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
    concurrency:
      group: claude-mentions-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    # One hung agent run must not hold the per-thread queue for the 360-minute
    # default (zetetic-team-subagents #242 review, finding 4).
    # source: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idtimeout-minutes
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # The `if:` above checks who asked, not which branch the pinned action will
      # check out and push to (src/modes/tag/index.ts fetches the PR head). An
      # owner-authored PR whose head is a fork, or main itself, must not become a
      # fix target (zetetic-team-subagents #242 review, finding 1).
      - name: Authorize owner fix target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if jq -e '.issue.pull_request != null' "$GITHUB_EVENT_PATH" >/dev/null; then
            gh api "repos/$GH_REPO/pulls/$ISSUE_NUMBER" |
              jq -e --arg repo "$GH_REPO" \
                '.head.repo.full_name == $repo and .head.ref != .base.repo.default_branch' >/dev/null
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Use the action App token instead of a persisted workflow token.
          persist-credentials: false
      - name: Install subprocess isolation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap socat
          # source: upstream action.yml subprocess isolation dependency setup.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
      - uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Upstream action.yml and src/github/data/fetcher.ts at the pinned SHA
          # apply this filter to issue comments, reviews and inline comments.
          include_comments_by_actor: ${{ github.repository_owner }}
          # No --permission-mode: inherit tag mode's workspace edit approval
          # (src/modes/tag/index.ts at the pinned action SHA).
          # Last value wins: upstream base-action/src/parse-sdk-options.ts.
          # Tag mode grants edits and scoped git only; headless, anything that
          # falls through to "ask" is denied (src/modes/tag/index.ts#L148-L201).
          # The allowlist is CLAUDE.md's validation set: uv sync, pytest, ruff,
          # python -m mcp_server.doctor, python scripts/check_craftsmanship.py,
          # plus git and gh for the branch and the PR. No Bash(bash:*).
          claude_args: |
            --strict-mcp-config
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(uv:*),Bash(pytest:*),Bash(python:*),Bash(python3:*),Bash(ruff:*)"
            --model "claude-opus-5-5"
