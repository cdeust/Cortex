name: Claude Code

# @claude on a PR or issue: Claude can fetch, rebase, test, push and arm
# auto-merge. Every push also gets the two native Claude reviews (code, security)
# from the review job below. It is triggered by workflow_run, so it always runs this
# file as it is on main: a PR that edits pipeline.yml is still reviewed as claude[bot].
# The PR head is fetched as data (diff file) and never checked out or executed.
# source: https://code.claude.com/docs/en/github-actions

on:
  workflow_run:
    workflows: [Pipeline]
    types: [requested]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login != 'claude[bot]') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          claude_args: |
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,LS,Skill,Task,Agent,Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(python:*),Bash(pytest:*),Bash(pip:*),Bash(uv:*),Bash(uvx:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(node:*),Bash(cargo:*),Bash(bash:*),Bash(sh:*),Bash(make:*),Bash(jq:*),Bash(claude:*),Bash(actionlint:*),Bash(ruff:*),Bash(pipx:*),Bash(coverage:*),Bash(tsc:*),Bash(shellcheck:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(test:*),mcp__github_inline_comment__create_inline_comment"

  review:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.pull_requests[0].number
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR as data
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR/head"
          [ "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA" ] || { echo "::error::head moved; a newer run reviews it"; exit 1; }
          git diff "origin/main...$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"
      - name: Code review
        uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          allowed_bots: "dependabot[bot],chatgpt-codex-connector[bot]"
          prompt: |
            Review ${{ github.repository }}/pull/${{ env.PR }} at head ${{ env.HEAD_SHA }}.
            Read the complete diff file ${{ runner.temp }}/pr.diff, then call the Skill tool once with skill code-review:code-review.
            Wait for every review agent. Then publish the skill's full result with gh pr comment ${{ env.PR }} --body-file, headed with the reviewed SHA.
            Never check out or run PR code. Report any tool failure instead of a partial review.
          claude_args: '--allowedTools "Agent,Skill,Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git show:*),Bash(git log:*)"'
      - name: Security review
        if: always() && !cancelled()
        uses: anthropics/claude-code-action@aa8a7738e48bf30a40ee499ce818bef081c5ab5e # v1.0.257
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot[bot],chatgpt-codex-connector[bot]"
          prompt: |
            Review ${{ github.repository }}/pull/${{ env.PR }} at head ${{ env.HEAD_SHA }}.
            Read the complete diff file ${{ runner.temp }}/pr.diff, then call the Skill tool once with skill security-review.
            Publish the skill's full result with gh pr comment ${{ env.PR }} --body-file, headed with the reviewed SHA.
            Never check out or run PR code. Report any tool failure instead of a partial review.
          claude_args: '--allowedTools "Agent,Skill,Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git show:*),Bash(git log:*)"'
