name: Claude Code

# Every push to a PR gets a Claude Code review (/code-review then /security-review,
# one cycle), the findings are applied on the PR branch, and squash auto-merge is
# armed so the PR merges once CI is green. @claude in a comment, review or issue
# runs Claude on that request.
# Action pinned by SHA: anthropics/claude-code-action v1.0.256.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    # Commits pushed by Claude itself do not trigger another review.
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.sender.login != 'claude[bot]' &&
      github.event.sender.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            1. Post a PR comment starting with "@claude" that summarises the commits pushed to this PR.
            2. Run /code-review on this PR's diff against its base, then /security-review. One run each, one cycle.
            3. Post the findings as inline comments on the lines concerned.
            4. Apply every real finding on the PR branch, run the repository's tests for the touched code, commit and push.
            5. Arm auto-merge: gh pr merge ${{ github.event.pull_request.number }} --auto --squash
          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(python3:*),Bash(pytest:*),Bash(bash:*),Bash(npm:*),Bash(uv:*),Bash(cargo:*),mcp__github_inline_comment__create_inline_comment"

  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login != 'claude[bot]') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
