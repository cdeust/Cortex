name: Claude Code

# @claude on a PR or issue: Claude can fetch, rebase, test, push and arm
# auto-merge. The review and merge of every push live in pipeline.yml.
# source: https://code.claude.com/docs/en/github-actions

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.login != 'claude[bot]') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          claude_args: |
            --allowedTools "Read,Edit,MultiEdit,Write,Glob,Grep,LS,Skill,Task,Agent,Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(python:*),Bash(pytest:*),Bash(pip:*),Bash(uv:*),Bash(uvx:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Bash(node:*),Bash(cargo:*),Bash(bash:*),Bash(sh:*),Bash(make:*),Bash(jq:*),Bash(claude:*),Bash(actionlint:*),Bash(ruff:*),Bash(pipx:*),Bash(coverage:*),Bash(tsc:*),Bash(shellcheck:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(test:*),mcp__github_inline_comment__create_inline_comment"
