name: Claude Code

# source: https://github.com/anthropics/claude-code-action/blob/8041f1d17e0e7d2f2cfe35002962e9f26237c0bb/.github/workflows/claude.yml
# Cortex uses its existing OAuth account and owner-authored default-branch events.
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    if: >-
      github.event.sender.login == github.repository_owner
      && ((github.event_name == 'issue_comment'
       && contains(github.event.comment.body, '@claude')
       && github.event.issue.user.login == github.repository_owner
       && github.event.comment.user.login != 'claude[bot]'
       && github.event.comment.user.type != 'Bot')
      || (github.event_name == 'issues'
       && github.event.issue.user.login == github.repository_owner
       && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    # Run one owner request per thread at a time; retain pending requests.
    # source: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
    concurrency:
      group: claude-mentions-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    # Workflow-capable credential is exposed only to default-branch owner requests.
    environment: claude-workflow-edit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The action configures git auth with the supplied workflow-capable token.
          persist-credentials: false
      - name: Install subprocess isolation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap socat
          # source: upstream action.yml subprocess isolation dependency setup.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
      - uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          # source: pinned action.yml github_token; docs/faq.md workflow limitation.
          github_token: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Upstream action.yml and src/github/data/fetcher.ts at the pinned SHA
          # apply this filter to issue comments, reviews and inline comments.
          include_comments_by_actor: ${{ github.repository_owner }}
          # Keep tag mode acceptEdits; explicitly allow protected workflow edits.
          # source: pinned src/modes/tag/index.ts and base-action/src/parse-sdk-options.ts.
          # Tool allow rules accumulate with the upstream tag-mode tools.
          claude_args: |
            --strict-mcp-config
            --allowedTools "Edit(.github/workflows/**),Write(.github/workflows/**)"
            --append-system-prompt "This owner-triggered job uses a supplied GitHub token with workflow write scope. When the owner requests workflow fixes, edit and push .github/workflows files to the existing PR branch. The default GitHub App workflow-write limitation does not apply to this job. Never push to main or alter repository settings."
            --model "claude-opus-5-5"
