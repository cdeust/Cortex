name: OpenSSF Scorecard

# source: ADR-0809







#
# source: ADR-0809



on:
  schedule:
    - cron: "0 7 * * 2"   # Tuesdays 07:00 UTC — posture drifts by inaction
  branch_protection_rule:
  push:
    branches: [main]
  workflow_dispatch:

# source: ADR-0809









permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # source: ADR-0809
    timeout-minutes: 2
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish signed results to the OpenSSF API
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
