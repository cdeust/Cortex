name: Sync Claude OAuth secret

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'cdeust/Cortex' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2 # source: six gh API calls; operational cap matching release.yml.
    environment: secret-sync
    steps:
      - name: Copy the trusted Cortex secret to the three target repositories
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SECRET_SYNC_TOKEN }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo '::error::SECRET_SYNC_TOKEN is missing'; exit 1; }
          test -n "$CLAUDE_TOKEN" || { echo '::error::CLAUDE_CODE_OAUTH_TOKEN is missing'; exit 1; }
          start=$(date -u +%FT%TZ)
          for repo in cdeust/ci-autonome cdeust/cortex-vision cdeust/cortex-voice; do
            printf '%s' "$CLAUDE_TOKEN" | gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo "$repo"
            n=$(gh secret list --repo "$repo" --json name,updatedAt \
              --jq "[.[] | select(.name == \"CLAUDE_CODE_OAUTH_TOKEN\" and .updatedAt >= \"$start\")] | length")
            test "$n" = 1 || { echo "::error::CLAUDE_CODE_OAUTH_TOKEN not updated in $repo"; exit 1; }
            echo "::notice::synced $repo"
          done
