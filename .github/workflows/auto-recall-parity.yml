name: Auto recall parity

on:
  pull_request:
    paths:
      - "mcp_server/**"
      - "benchmarks/auto_recall_parity.py"
      - "benchmarks/auto_recall_scores.py"
      - "benchmarks/fixtures/auto_recall_paraphrases.json"
      - "tests_py/handlers/test_recall_low_signal_filter.py"
      - "tests_py/handlers/test_inject_triggered_memories.py"
      - "tests_py/hooks/test_auto_recall*.py"
      - "tests_py/hooks/test_sqlite_hook_*.py"
      - ".github/workflows/auto-recall-parity.yml"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Create the environment
        run: python -m venv .venv
      - name: Install locked CI dependencies
        uses: ./.github/actions/uv-locked-install
        with:
          environment: ${{ github.workspace }}/.venv
          set: --extra dev --extra sqlite --extra codebase --extra postgresql --group lint
      - name: Check proposed source structure
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --no-sync ruff check mcp_server benchmarks/auto_recall_parity.py benchmarks/auto_recall_scores.py tests_py/hooks/test_auto_recall*.py
          uv run --no-sync python scripts/check_craftsmanship.py --base origin/main
      - name: Regression tests against the prior implementation
        env:
          BASE_SHA: 3aef5b590c839a0b2a46267a20477785490f691c # inspected pre-fix source
        run: |
          git worktree add --detach "$RUNNER_TEMP/recall-before" "$BASE_SHA"
          for path in tests_py/handlers/test_recall_low_signal_filter.py tests_py/hooks/test_auto_recall_paraphrase.py; do
            cp "$path" "$RUNNER_TEMP/recall-before/$path"
          done
          set +e
          (cd "$RUNNER_TEMP/recall-before" && "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest --tb=short -q -p no:randomly tests_py/handlers/test_recall_low_signal_filter.py tests_py/hooks/test_auto_recall_paraphrase.py) 2>&1 | tee "$RUNNER_TEMP/recall-before-tests.txt"
          status=${PIPESTATUS[0]}
          set -e
          # pytest's test-failure exit, never an import/collection/usage error.
          test "$status" -eq 1
      - name: Regression tests against proposed implementation
        env:
          CORTEX_RERANKER_OFFLINE: "1"
        run: |
          uv run --no-sync pytest --tb=short -q -p no:randomly tests_py/handlers/test_recall_low_signal_filter.py tests_py/handlers/test_inject_triggered_memories.py tests_py/hooks/test_auto_recall_paraphrase.py tests_py/hooks/test_auto_recall_review.py tests_py/hooks/test_auto_recall_trust.py tests_py/hooks/test_auto_recall_pg_query.py tests_py/hooks/test_sqlite_hook_scope.py tests_py/hooks/test_sqlite_hook_paths.py
      - name: Measure prior hook and tool gap
        run: |
          uv run --no-sync python benchmarks/auto_recall_parity.py --codebase "$RUNNER_TEMP/recall-before" --report "$RUNNER_TEMP/recall-before.json" --expect-gap
      - name: Measure proposed hook and tool parity
        run: |
          uv run --no-sync python benchmarks/auto_recall_parity.py --codebase "$GITHUB_WORKSPACE" --report "$RUNNER_TEMP/recall-after.json"
      - name: Preserve raw comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auto-recall-parity
          path: |
            ${{ runner.temp }}/recall-before-tests.txt
            ${{ runner.temp }}/recall-before.json
            ${{ runner.temp }}/recall-after.json
          if-no-files-found: error
