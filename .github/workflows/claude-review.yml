name: PR Review

# source: https://github.com/anthropics/claude-code-action/blob/8041f1d17e0e7d2f2cfe35002962e9f26237c0bb/.github/workflows/claude-review.yml
# Native App OIDC auth on same-repository PRs; main checkout retained.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  budget:
    name: Claude review budget
    # Owner rule 2026-11-04 (ADR-1119): three automatic reviews per PR. The
    # fourth is not run: the accepted part merges, the rest goes to a new
    # refinement PR. Reads run metadata only, with no secret and no write scope.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # source: operational cap; the step is a few API calls.
    permissions:
      contents: read
      actions: read
    outputs:
      round: ${{ steps.count.outputs.round }}
      cap: ${{ steps.count.outputs.cap }}
      skip: ${{ steps.count.outputs.skip }}
      reviewed_sha: ${{ steps.count.outputs.reviewed_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Count the reviews this PR already received
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 -I scripts/ci_review_budget.py

  review:
    name: Claude review
    needs: budget
    # Dependabot-triggered pull_request events receive Dependabot secrets only,
    # so secrets.CLAUDE_CODE_OAUTH_TOKEN is empty there and the action aborts with
    # "Environment variable validation failed" (run 41180098727, PR #844).
    # source: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#responding-to-events
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
      && needs.budget.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Install subprocess isolation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap socat
          # source: upstream action.yml subprocess isolation dependency setup.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
      - name: PR Review
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Native progress/final publication; pinned action restores base config.
          track_progress: true
          allowed_bots: "claude[bot],chatgpt-codex-connector[bot],dependabot[bot]"
          prompt: |
            /review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}
            Complete all five reviews using foreground agents and wait for their actual reports.
            Use `gh pr comment` for top-level feedback and a completion summary, including when there are no findings.
            Only post GitHub comments - don't submit review text as messages.
            Review contract (ADR-1119): this is review ${{ needs.budget.outputs.round }} of at most ${{ needs.budget.outputs.cap }}.
            A Blocker is a defect you traced or reproduced in the diff that makes CI, security or a CLAUDE.md non-negotiable wrong. Everything else is a Note.
            Post findings only for Blockers. Post at most 3 Notes, one line each, under "Notes, no action before merge". Rate a docstring, comment, wording, naming or test-coverage gap above Note only if it states something false about security or behaviour.
            The commit reviewed by the previous review is "${{ needs.budget.outputs.reviewed_sha }}" (empty on the first review). If it is not empty: first check that each earlier Blocker is fixed, then review only the commits pushed after it (gh pr view --json commits) and do not re-audit unchanged code.
            On the last review, say which part of the PR is accepted and which files or commits carry the open Blockers, so the author can merge the accepted part and send the rest to a refinement PR.
            End with exactly one line: "Verdict: approve" or "Verdict: block".
          # Scoped gh permissions are from upstream docs/solutions.md.
          claude_args: |
            --strict-mcp-config
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --model "claude-opus-5-5"
