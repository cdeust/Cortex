name: PR Review

# source: https://github.com/anthropics/claude-code-action/blob/8041f1d17e0e7d2f2cfe35002962e9f26237c0bb/.github/workflows/claude-review.yml
# Native App OIDC auth on same-repository PRs; main checkout retained.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    name: Claude review
    # A Dependabot-triggered run receives Dependabot secrets only, never the
    # Actions OAuth token: skip it, as the legacy review job does. A push by a
    # person to the same branch runs this review with the Actions secrets.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      # source: pinned action src/modes/tag/index.ts#L79 fetches the PR head
      # (src/github/operations/branch.ts#L241) before its own git auth, and
      # src/github/operations/git-config.ts#L78-L81 unsets this local header
      # before Claude runs. Private repositories cannot fetch anonymously.
      - name: Authorize pinned action fetch
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic"
          git config --local "http.$GITHUB_SERVER_URL/.extraheader" "AUTHORIZATION: basic $basic"
      - name: Install subprocess isolation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap socat
          # source: upstream action.yml subprocess isolation dependency setup.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
      - name: PR Review
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Native progress/final publication; pinned action restores base config.
          track_progress: true
          allowed_bots: "claude[bot],chatgpt-codex-connector[bot]"
          prompt: |
            /review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}
            Complete all five reviews using foreground agents and wait for their actual reports.
            Use `gh pr comment` for top-level feedback and a completion summary, including when there are no findings.
            Only post GitHub comments - don't submit review text as messages.
            End the completion summary with this exact last line, unchanged except `true` becomes `false` when any finding blocks the merge:
            <!-- claude-review-verdict:v1 {"head":"${{ github.event.pull_request.head.sha }}","merge":true} -->
          # Scoped gh permissions are from upstream docs/solutions.md.
          claude_args: |
            --strict-mcp-config
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --model "claude-opus-5-5"
