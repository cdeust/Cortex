name: PR Review

# source: https://github.com/anthropics/claude-code-action/blob/8041f1d17e0e7d2f2cfe35002962e9f26237c0bb/.github/workflows/claude-review.yml
# Native App OIDC auth on same-repository PRs; main checkout retained.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

# One review admission at a time per pull request: the budget counts completed
# reviews, so two pushes whose runs overlap would each be admitted as the same
# round (ADR-1119). A run in progress is never cancelled; of the runs waiting
# behind it, GitHub keeps the newest, which is the head that matters.
# source: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  budget:
    name: Claude review budget
    # Owner rule 2026-11-04 (ADR-1119): three automatic reviews per PR. The
    # fourth is not run: the accepted part merges, the rest goes to a new
    # refinement PR. Reads run metadata only, with no secret and no write scope.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5 # source: operational cap; the step is a few API calls.
    permissions:
      contents: read
      actions: read
    outputs:
      round: ${{ steps.count.outputs.round }}
      cap: ${{ steps.count.outputs.cap }}
      skip: ${{ steps.count.outputs.skip }}
      reviewed_sha: ${{ steps.count.outputs.reviewed_sha }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Count the reviews this PR already received
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 -I scripts/ci_review_budget.py

  review:
    name: Claude review
    needs: budget
    # Dependabot-triggered pull_request events receive Dependabot secrets only,
    # so secrets.CLAUDE_CODE_OAUTH_TOKEN is empty there and the action aborts with
    # "Environment variable validation failed" (run 41180098727, PR #844).
    # source: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#responding-to-events
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
      && needs.budget.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      # A private repository cannot be fetched anonymously, and the pinned action
      # fetches the PR head before its own git auth (run 42785671958 of
      # ci-autonome: "could not read Username for 'https://github.com'"). The
      # step runs only there, so this file is the same in every repository.
      # source: pinned action src/modes/tag/index.ts#L79 fetches the PR head
      # (src/github/operations/branch.ts#L241), and
      # src/github/operations/git-config.ts#L78-L81 unsets this local header
      # before Claude runs.
      - name: Authorize pinned action fetch
        if: github.event.repository.private
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic"
          git config --local "http.$GITHUB_SERVER_URL/.extraheader" "AUTHORIZATION: basic $basic"
      - name: Install subprocess isolation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap socat
          # source: upstream action.yml subprocess isolation dependency setup.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
      - name: PR Review
        id: review
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Native progress/final publication; pinned action restores base config.
          track_progress: true
          allowed_bots: "claude[bot],chatgpt-codex-connector[bot],dependabot[bot]"
          prompt: |
            /review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}
            Complete every review /review-pr lists using foreground agents and wait for their actual reports.
            Use `gh pr comment` for top-level feedback and a completion summary, including when there are no findings.
            Only post GitHub comments - don't submit review text as messages.
            Review contract (ADR-1119): this is review ${{ needs.budget.outputs.round }} of at most ${{ needs.budget.outputs.cap }}.
            A Blocker is a defect you traced or reproduced in the diff that makes CI, security or a CLAUDE.md non-negotiable wrong. Everything else is a Note.
            Post findings only for Blockers. Post at most 3 Notes, one line each, under "Notes, no action before merge". Rate a docstring, comment, wording, naming or test-coverage gap above Note only if it states something false about security or behaviour.
            The commit reviewed by the previous review is "${{ needs.budget.outputs.reviewed_sha }}" (empty on the first review). If it is not empty: first check that each earlier Blocker is fixed, then review only the commits pushed after it (gh pr view --json commits) and do not re-audit unchanged code.
            On the last review, say which part of the PR is accepted and which files or commits carry the open Blockers, so the author can merge the accepted part and send the rest to a refinement PR.
            End with exactly one line: "Verdict: approve" or "Verdict: block".
            The resolver reads a verdict only from a comment that links this run (ADR-1130): in every comment that carries the verdict line, the `gh pr comment` review included, put the line "[View job run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" just before it.
          # Scoped gh permissions are from upstream docs/solutions.md.
          claude_args: |
            --strict-mcp-config
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --model "claude-opus-5-5"
      # Which tool calls the review was refused, by tool name and count
      # (ADR-1138, issue 1021). The transcript stays hidden, since this
      # repository is public, so a review that ran without `/review-pr` showed
      # nothing but a higher permission_denials_count. Only the characters
      # A-Z, a-z, 0-9, "_" and "-" of a name are printed, so nothing read from
      # the file can form a workflow command, and no tool input is printed.
      # Nothing from the checkout runs here: after the action the working tree
      # is the pull request's. A file jq cannot read is said, not hidden, and
      # does not fail the job: the verdict does not depend on this step.
      # source: the result message of the execution file carries
      # permission_denials, each with tool_name, tool_use_id and tool_input
      # (pinned action, base-action/src/run-claude-sdk.ts#L150 and #L222-L224).
      - name: Refused tool calls
        if: ${{ always() && steps.review.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          if ! refused="$(jq -r '
            [ .[] | select(.type == "result") | (.permission_denials // [])[]
              | (.tool_name // "") | gsub("[^A-Za-z0-9_-]"; "")
              | if . == "" then "unnamed" else . end ]
            | group_by(.) | map("refused: \(.[0]) x\(length)")
            | if length == 0 then ["refused: none"] else . end | .[]
          ' "$EXECUTION_FILE")"; then
            refused="refused: the execution file could not be read"
          fi
          printf '%s\n' "$refused" | tee -a "$GITHUB_STEP_SUMMARY"
