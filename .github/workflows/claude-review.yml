name: Claude metadata diagnostic

# source: https://github.com/anthropics/claude-code-action/blob/8041f1d17e0e7d2f2cfe35002962e9f26237c0bb/.github/workflows/claude-review.yml
# Trusted-base variant: upstream docs/security.md. Auth: upstream issue713.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    name: Claude review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Install subprocess isolation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap socat
          # source: official action.yml Install subprocess isolation dependencies.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
      - name: PR Review
        id: native
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot],chatgpt-codex-connector[bot],dependabot[bot]"
          prompt: |
            Diagnostic only for REPO: cdeust/Cortex PR_NUMBER: 812.
            Use Agent once with code-quality-reviewer to inspect the checked-out .github/workflows/claude-review.yml.
            Ask for one concise observation. Wait for its actual report, then publish that observation using gh pr comment 812 --repo cdeust/Cortex.
            Do not modify files. This is a single-agent diagnostic, not a complete PR review.
          # Scoped gh permissions are from upstream docs/solutions.md.
          claude_args: |
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --model "claude-opus-4-7"
      - name: Publication diagnostic categories only
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.native.outputs.execution_file }}
        run: |
          python3 - <<'PYDIAG'
          import json, os
          from pathlib import Path
          # Source: official action execution_file SDK message array and permission_denials.
          stack = [json.loads(Path(os.environ["EXECUTION_FILE"]).read_text())]
          known = {"Read", "Glob", "Grep", "Bash", "Skill", "Agent", "Task", "TaskOutput", "AgentOutput", "SubagentHandback", "SendMessage", "ToolSearch", "TodoWrite", "ListAgents", "ReadNotifications", "ExitPlanMode", "EnterPlanMode", "AskUserQuestion", "Write", "Edit", "WebFetch", "WebSearch", "TaskCreate", "TaskUpdate", "TaskList", "TaskGet", "TaskStop", "BashOutput", "KillBash", "mcp__github_inline_comment__create_inline_comment"}
          keywords = ("permission", "draft", "skip", "sandbox", "cannot", "unknown", "not found", "auth", "token", "argument", "review-pr", "agent", "denied", "network", "approve", "gh pr comment")
          commands = ("gh pr view", "gh pr diff", "gh pr comment", "gh api", "git diff", "git log", "git show", "cat ", "ls ", "pwd")
          while stack:
              item = stack.pop()
              if isinstance(item, list):
                  stack.extend(reversed(item))
                  continue
              if not isinstance(item, dict):
                  continue
              kind = item.get("type")
              if kind == "tool_use" or "tool_name" in item:
                  name = item.get("name", item.get("tool_name"))
                  args = item.get("input", item.get("tool_input", {}))
                  command = str(args.get("command", "")) if isinstance(args, dict) else ""
                  print(json.dumps({"tool": name if name in known else "other", "denied": "tool_name" in item, "command_categories": {value: command.startswith(value) for value in commands}}))
              if kind in {"result", "tool_result"}:
                  content = str(item.get("result", item.get("content", ""))).lower()
                  print(json.dumps({"terminal": kind == "result", "error": item.get("is_error") is True, "keywords": {word: word in content for word in keywords}}))
              if kind == "result":
                  stack.extend(reversed(item.get("permission_denials", [])))
              if "message" in item:
                  stack.append(item["message"])
              if "content" in item and isinstance(item["content"], list):
                  stack.extend(reversed(item["content"]))
          PYDIAG
