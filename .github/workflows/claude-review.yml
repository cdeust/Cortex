name: Claude Code Review

# Source: https://code.claude.com/docs/en/github-actions ("Run a skill"), with the
# subscription token and actions pinned by SHA. The code-review plugin's skill
# brings its own allowed-tools; --allowedTools must name the inline-comment MCP
# tool so the action starts that server. The skill skips drafts, closed PRs and
# PRs that already carry a Claude comment.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dependabot PRs: the action rejects bot actors unless listed
          # (docs: "Who can trigger runs").
          allowed_bots: "dependabot[bot]"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
