# Paths GitHub secret scanning skips.
# source: https://docs.github.com/en/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/excluding-folders-and-files-from-secret-scanning
#
# The vendored gitleaks default rule set and its JSON conversion carry the
# allowlist of the gcp-api-key rule: public example keys the rule must ignore.
# Scanned, they raised 16 false "Google API Key" alerts (2026-10-21). The TOML is
# byte-identical to gitleaks v8.30.1 config/gitleaks.toml (sha256 in
# third_party/gitleaks/v8.30.1/PROVENANCE.json); a new vendored version needs
# its own line here.
paths-ignore:
  - "third_party/gitleaks/v8.30.1/gitleaks.toml"
  - "mcp_server/shared/redaction_rules/gitleaks.json"
