# Dependabot config.
#
# This file exists because this repo pins by hash: every `uses:` in
# .github/workflows is a 40-char commit SHA, and every `FROM` in the three
# Dockerfiles is a digest. A hash pin that nothing refreshes is strictly worse
# than a tag — it freezes the dependency at the day it was pinned and stops
# receiving upstream security fixes. Dependabot is the half of "pinned
# dependencies" that makes the pins safe rather than merely reproducible.
#
# Scope note: `open-pull-requests-limit` is deliberately low. The point is a
# steady trickle that gets reviewed, not a queue nobody reads.
version: 2
updates:
  # Keeps the SHA pins in .github/workflows fresh. Dependabot rewrites the SHA
  # and updates the trailing `# vX.Y.Z` comment in the same edit.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # One entry per Dockerfile: Dependabot's docker ecosystem scans a directory,
  # not a file tree, so a single "/" entry would miss docker/ and .devcontainer/.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"

  # Python dependencies are declared in pyproject.toml and locked in uv.lock.
  #
  # Note on what these PRs still require by hand: Dependabot rewrites a version
  # specifier — in pyproject.toml, or directly in one of the generated
  # requirements/*.txt exports it reads as a manifest — and never runs `uv lock`
  # or scripts/generate_pip_constraints.py. Every `deps` PR therefore arrives
  # failing the two Lint steps that guard exactly that chain (`uv lock --check`,
  # `generate_pip_constraints.py --check`). Resync before merging:
  #
  #   uv lock --upgrade-package <name>      # uv 0.11.3, the version ci.yml pins
  #   python scripts/generate_pip_constraints.py
  #
  # Pushing that commit to the dependabot/** branch disables Dependabot's
  # auto-rebase for the PR — do not comment `@dependabot rebase` afterwards, it
  # would drop the resync.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # caio is transitive, not declared: hypermnesia-mcp -> fastmcp ->
      # fastmcp-slim -> py-key-value-aio -> aiofile -> caio. Every published
      # aiofile pins caio below 0.10 — 3.9.0 `caio<0.10.0,>=0.9.0`, and 3.10.0
      # through 3.11.1 (latest, 2026-05-16) `caio~=0.9.0` — while caio 0.10.2
      # shipped 2026-07-05, after it. No version set satisfies both, so the bump
      # is unresolvable rather than merely unresynced: PR #322 failed every job,
      # not just Lint, and was closed for this reason.
      # No advisory affects caio (`gh api "/advisories?ecosystem=pip&affects=caio"`
      # returned none on 2026-08-01), so 0.9.25 is not a security hold.
      # Remove this entry as soon as aiofile widens its bound.
      # source: PyPI JSON API, verified 2026-08-01.
      - dependency-name: "caio"
        versions: [">=0.10.0"]

      # pydantic-core is transitive, not declared: hypermnesia-mcp ->
      # pydantic -> pydantic-core. Unlike a version *range*, pydantic pins
      # its Rust extension EXACTLY per release (ABI lockstep, not a
      # compatibility range) — pydantic 2.13.4 (latest STABLE, no newer
      # stable exists) declares `pydantic-core==2.46.4`. This repo resolves
      # the latest stable pydantic by default (no pre-release opt-in), so
      # pydantic-core must match 2.13.4's exact pin, not some other
      # pydantic release's.
      #
      # CORRECTION (2026-08-10 review): an earlier version of this comment
      # claimed no pydantic release at any maturity accepts pydantic-core
      # 2.47.0. That was checked against only one of the two pre-releases
      # past 2.13.4 (2.14.0b1, which does require `pydantic-core==2.48.0`)
      # and wrongly generalized to the other. The full picture, from
      # PyPI's own metadata:
      #   pydantic 2.13.4  (stable) -> pydantic-core==2.46.4
      #   pydantic 2.14.0a1 (alpha) -> pydantic-core==2.47.0
      #   pydantic 2.14.0b1 (beta)  -> pydantic-core==2.48.0
      # pydantic-core 2.47.0 DOES have a matching pydantic release — the
      # 2.14.0a1 alpha — this repo simply does not (and should not) track
      # a pydantic alpha. The bump is still correctly rejected, for the
      # narrower, accurate reason above, not because no match exists.
      # PR #333 failed every job, not just Lint, and was closed for this
      # reason.
      #
      # No advisory affects pydantic-core
      # (`gh api "/advisories?ecosystem=pip&affects=pydantic-core"`
      # returned none on 2026-08-10), so 2.46.4 is not a security hold.
      #
      # Bounded, not open-ended: only the 2.47.x line is excluded (the
      # alpha-only version this PR's history is about). 2.48.0, matching
      # the 2.14.0 BETA, is left reachable — once pydantic's stable line
      # advances to (or past) 2.14.0, a dependabot bump to 2.48.0 should
      # go through on its own rather than being silently blocked by an
      # open `>2.46.4` range. Remove this entry entirely once pydantic's
      # stable release line moves past 2.13.x.
      # source: PyPI JSON API https://pypi.org/pypi/pydantic/json +
      #         https://pypi.org/pypi/pydantic/2.14.0a1/json +
      #         https://pypi.org/pypi/pydantic/2.14.0b1/json, read 2026-08-10.
      - dependency-name: "pydantic-core"
        versions: [">2.46.4,<2.48.0"]
