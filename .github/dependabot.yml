# Dependabot config.
#
# source: ADR-0801





#
# source: ADR-0801




version: 2
updates:
  # Keeps the SHA pins in .github/workflows fresh. Dependabot rewrites the SHA
  # and updates the trailing `# vX.Y.Z` comment in the same edit.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

  # source: ADR-0801

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"

  # Python dependencies are declared in pyproject.toml and locked in uv.lock,
  # the only dependency file: the uv ecosystem rewrites both through
  # `uv lock --upgrade-package`, so its PRs need no follow-up commit.
  # source: ADR-1092
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    ignore:
      # source: ADR-0801










      - dependency-name: "caio"
        versions: [">=0.10.0"]

      # source: ADR-0801







      #
      # source: ADR-0801














      #
      # source: ADR-0801


      #
      # source: ADR-0801









      - dependency-name: "pydantic-core"
        versions: [">2.46.4,<2.48.0"]
