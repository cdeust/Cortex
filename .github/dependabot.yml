# Dependabot config.
#
# source: ADR-0801





#
# source: ADR-0801




version: 2
updates:
  # Keeps the SHA pins in .github/workflows fresh. Dependabot rewrites the SHA
  # and updates the trailing `# vX.Y.Z` comment in the same edit.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci"

  # source: ADR-0801

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"

  # Python dependencies are declared in pyproject.toml and locked in uv.lock,
  # the only dependency file: the uv ecosystem rewrites both through
  # `uv lock --upgrade-package`, so its PRs need no follow-up commit.
  # source: ADR-1092
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
    ignore:
      # source: ADR-0801










      - dependency-name: "caio"
        versions: [">=0.10.0"]

      # source: ADR-0801







      #
      # source: ADR-0801














      #
      # source: ADR-0801


      #
      # source: ADR-0801









      - dependency-name: "pydantic-core"
        versions: [">2.46.4,<2.48.0"]

      # Locked at one version per platform range by the `platform-bounds`
      # group of pyproject.toml (and sentence-transformers through its
      # transformers range). Dependabot's updater asks uv for ONE version,
      # `uv lock --upgrade-package <name>==<latest>`, which those ranges
      # refuse: run against this lock, the updater recorded
      # `dependency_file_not_resolvable` for each of them on every run and
      # could never open their pull request. They are bumped by hand:
      # `uv lock --upgrade-package <name>` moves each platform to the newest
      # version its range allows (CONTRIBUTING.md). An ignored package gets
      # no security pull request either: its alert still shows in the
      # Security tab and is fixed with the same command.
      # source: ADR-1092
      - dependency-name: "torch"
      - dependency-name: "onnxruntime"
      - dependency-name: "numpy"
      - dependency-name: "transformers"
      - dependency-name: "sentence-transformers"
      - dependency-name: "cryptography"

      # Not a platform-bounds package, but locked at two versions because of
      # one: torch 2.11, the newest the macOS < 14 Apple Silicon range allows,
      # requires `setuptools<82`, torch 2.13 takes any (PyPI requires_dist),
      # so the lock holds setuptools 81 and 84. A request for one setuptools
      # version, which uv does not refuse, is met by moving that range back to
      # torch 2.10, and the platform-coverage test fails (PR #669, run
      # 37666850067). Bumped by hand with `uv lock --upgrade-package
      # setuptools`, which keeps each range on its newest torch.
      # source: ADR-1092
      - dependency-name: "setuptools"
